queries:
  # ── family: identifier (exact reference lane) ──
  - id: ident-task-ref
    family: identifier
    query: "t-gvr-check"
    top1: task:t-gvr-check
    max_latency_ms: 50
  - id: ident-cr-number
    family: identifier
    query: "CR-291543784"
    top1: task:t-cr-review
    max_latency_ms: 50
  - id: ident-commit-sha-prefix
    family: identifier
    query: "3f9c2ab71e0d"
    must_include: [session:s-commit-fix]
    max_latency_ms: 50
  - id: ident-url
    family: identifier
    query: "https://example.com/docs/roadmap-2026"
    top1: task:t-url-import
    max_latency_ms: 50

  # ── family: camel-subword ──
  - id: camel-gvr-reconciler
    family: camel-subword
    query: "kind event operator reconciler"
    must_include: [task:t-gvr-check]
    top1: task:t-gvr-check
    must_exclude: [task:t-junk-echo]
    min_coverage: 0.5
    max_latency_ms: 200
  - id: camel-exact-component
    family: camel-subword
    query: "AcmeEventOperator"
    must_include: [task:t-gvr-check]
    top1: task:t-gvr-check
    max_latency_ms: 200
  - id: camel-kebab-channel
    family: camel-subword
    query: "acme gateway dev"
    must_include: [task:t-gateway-cron]
    max_latency_ms: 200
  - id: camel-kebab-exact
    family: camel-subword
    query: "acme-gateway-dev"
    top1: task:t-gateway-cron
    max_latency_ms: 200
  - id: camel-http-subwords
    family: camel-subword
    query: "http response code"
    must_include: [memory:m-http-code]
    max_latency_ms: 200

  # ── family: cjk ──
  - id: cjk-search-index
    family: cjk
    query: "搜索 索引 修复"
    must_include: [task:t-search-fix]
    top1: task:t-search-fix
    max_latency_ms: 200
  - id: cjk-timeout-retry
    family: cjk
    query: "超时 重试"
    must_include: [task:t-retry-timeout]
    max_latency_ms: 200
  - id: cjk-phrase-order
    family: cjk
    query: "自动重试"
    must_include: [task:t-retry-timeout]
    # ordered-bigram phrase: the glossary note has 重试 but never 自动重试
    must_rank_above: [[task:t-retry-timeout, note:n-mixed-glossary]]
    max_latency_ms: 200
  - id: cjk-deploy-order
    family: cjk
    query: "数据库迁移 重启"
    must_include: [memory:m-deploy-cn]
    max_latency_ms: 200

  # ── family: mixed (CJK + Latin in one query) ──
  - id: mixed-timeout-retry
    family: mixed
    query: "timeout 自动重试"
    must_include: [task:t-retry-timeout]
    top1: task:t-retry-timeout
    max_latency_ms: 200
  - id: mixed-title-partial
    family: mixed
    query: "task title 索引"
    must_include: [task:t-search-fix]
    max_latency_ms: 200

  # ── family: paraphrase (no exact term overlap guaranteed) ──
  - id: para-dropped-events
    family: paraphrase
    query: "watch events silently dropped for second resource"
    must_include: [task:t-gvr-check]
    max_latency_ms: 200
  - id: para-key-rotation
    family: paraphrase
    query: "quarterly credential rotation"
    must_include: [task:t-recency-new]
    max_latency_ms: 200

  # ── family: scoring traps ──
  - id: trap-coverage-long-doc
    family: trap
    query: "kind event operator reconciler"
    # the long transcript spams 'operator' but never covers the other terms:
    # coverage must beat term-frequency
    must_rank_above: [[task:t-gvr-check, session:s-long-transcript]]
    max_latency_ms: 200
  - id: trap-recency-tiebreak
    family: trap
    query: "rotate signing keys"
    must_rank_above: [[task:t-recency-new, task:t-recency-old]]
    max_latency_ms: 200

  # ── family: junk exclusion ──
  - id: junk-echo-excluded
    family: junk
    query: "message test"
    must_exclude: [task:t-junk-echo]
    max_latency_ms: 200

  # ── family: body-coverage (2026-09-21 regression: the reported bug) ──
  - id: body-density-outranks-bare-title
    family: body-coverage
    query: "tablet reader app"
    must_include: [task:t-longbody-topic]
    # The substantive body must beat the empty stub. This FAILED before the
    # 2026-09-21 weight rebalance: at title weight 10 a 12-character title
    # reaches ~97% of bm25's per-phrase ceiling on one hit, so an empty task
    # was arithmetically indistinguishable from a real match.
    must_rank_above: [[task:t-longbody-topic, task:t-baretitle-topic]]
    max_latency_ms: 200
  - id: body-tail-term-reachable
    family: body-coverage
    # The term occurs once, past 1400 characters. The keyword lane always
    # reached it (FTS indexes the whole column); the VECTOR did not, because
    # the old passage policy embedded title + summary + note[:1400] and threw
    # the rest away. Meaningful mainly under --semantic.
    query: "quokkabyte counter"
    must_include: [task:t-tailterm]
    max_latency_ms: 200
  - id: cjk-long-body
    family: body-coverage
    # Guards the half of the BUDGET invariant no other case touches: CJK costs
    # ~1 token per character, so a 1400-char chunk breached the tokenizer's 512
    # cap and the pooled vector described only the prefix.
    query: "灰度发布"
    must_include: [note:n-cjk-longbody]
    max_latency_ms: 200
