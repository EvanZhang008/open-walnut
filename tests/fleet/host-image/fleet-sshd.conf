# Read before the stock sshd_config (the first value wins): keys only, one user.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers walnut
UsePAM no
# The harness passes the daemon's test windows (WALNUT_*) and an optional clock
# offset (libfaketime) through ~/.ssh/environment, so every process an SSH session
# starts, the daemon included, has them.
PermitUserEnvironment WALNUT_*,LD_PRELOAD,FAKETIME,FAKETIME_*
