name: Release

# Two channels, one workflow (docs/reference/releasing.md):
#
#   stable   automatic, once a day (jobs `promote-*`, checked when CI finishes on
#            main and hourly): the newest nightly that has been out 24 hours,
#            when it carries something new and installs and starts on fresh
#            Linux and macOS runners, becomes the next patch (pre-1.0; a
#            breaking change makes the next minor). Published as dist-tag `latest`,
#            tagged `vX.Y.Z`, a GitHub Release with its notes, then a
#            `release: X.Y.Z` commit on main rolls CHANGELOG and package.json
#            (scripts/stable-promote.mjs). By hand, a `vX.Y.Z` tag cut with
#            `bun run release -- patch|minor|major` publishes through jobs `stable-*`.
#            Either way its GitHub Release holds the compiled files and install.sh,
#            and then gets the Homebrew formula, the Mac app and (for two more
#            releases) the old Node archives (release-archives.yml).
#   nightly  about every six hours (checked when CI finishes on main and on the
#            schedule; and by hand): the newest commit on main that CI passed,
#            when it is not the last nightly (jobs `nightly-*`). Published as
#            `X.Y.(Z+1)-nightly.YYYYMMDD.N` under dist-tag `nightly`. Nothing is
#            committed: the version lives in the registry, not in package.json,
#            and so does the record of its commit (the version's `gitHead`).
#
# The job's token may point a ref only at a commit whose .github/workflows match
# main's tip: GitHub compares a new or moved ref with the default branch, not
# with the ref's old value or the commit's parent, and refuses anything else as
# "create or update workflow without `workflows` permission" (2026-10-03, when a
# `nightly` tag followed a green commit that main's newest commit had passed).
# So no job here tags an older commit as it is: the nightly keeps no tag, and the
# stable tag goes on the released commit or, when main's workflows moved on, on a
# child of it that carries main's workflows (job `promote`).
#
# Both channels publish only commits CI and the binary matrix passed
# (scripts/ci-gate.mjs reads the CI workflow's `CI OK` job and the run of
# binary-matrix.yml), because every install updates itself on restart. The
# nightly does not rerun the tests: CI already ran them on that exact commit.
#
# What a version is: the compiled Walnut, one file per target, built here with
# bun from the released commit at the released version (scripts/release-build.mjs;
# every target from one Linux runner, as the binary matrix builds them). Each
# channel builds once (jobs `*-build`), runs those very files on every system the
# binary matrix covers, reporting the released version (`*-files`, which call
# binary-matrix.yml with them), and publishes the same bytes: the publishing job
# builds nothing, it unpacks the build's .gz files, each checked by both of its
# SHA256SUMS lines (scripts/release-unpack.sh). npm gets
# a package per target, `@open-walnut/<target>`, and then `open-walnut`, the
# launcher that names them (scripts/npm-packages.mjs): platform packages first,
# so a version the update check sees always has its files. A stable's GitHub
# Release opens as a draft, gets the files gzipped, SHA256SUMS and install.sh
# (scripts/release-attach.sh), and only then goes public: install.sh, the formula
# and the Mac app read releases/latest/download, which pointed at a release
# without its files for minutes when it went public first. A nightly has no
# GitHub Release; it is on npm only.
#
# Authentication is npm trusted publishing (OIDC): no token is stored anywhere.
# One-time setup on npmjs.com, for open-walnut and for each @open-walnut/<target>
# package (docs/reference/releasing.md, "npm packages"), Settings > Trusted
# publisher: GitHub Actions, owner EvanZhang008, repository open-walnut,
# workflow release.yml.
# `--provenance` attaches the build attestation npm shows on the package page.
# Trusted publishing needs npm 11.5.1 or newer, so the job updates npm first. It
# pins the major: npm 12 changed install defaults (tarball URL dependencies and
# dependency install scripts, docs/reference/releasing.md "npm 12") and stopped
# the 0.6.0 publish, so a new major is taken on purpose.

on:
  push:
    tags: ['v*.*.*']
  # The checks only ask, and a gap decides: a nightly when the last one is 4.5h old
  # (scripts/nightly-version.mjs due), a stable when the last one is 23h old
  # (scripts/stable-promote.mjs plan). They ask whenever CI finishes on main,
  # which is when there is something new to ship, and on a schedule for a quiet
  # main. GitHub runs few of this repo's scheduled runs: 10 of about 75 in the 25
  # hours to 2026-10-03 13:00 UTC, with gaps of 3 to 5 hours, and a release
  # commit (pushed by the job's token) starts no CI. So every scheduled run asks
  # for BOTH channels, as often as GitHub allows: with one cron per channel, the
  # only run in the 2 hours after a nightly came due was the stable one, and the
  # nightly waited 7 hours.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Off the hour, which GitHub drops most.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'nightly: publish main now. stable: promote the soaked nightly now.'
        type: choice
        options: [nightly, stable]
        default: nightly
      force:
        description: 'Publish a nightly even when main has not moved since the last one'
        type: boolean
        default: false
      dry_run:
        description: 'stable: plan, build and smoke-test the newest nightly now (no 24h soak) and run its files on every system, publish nothing'
        type: boolean
        default: false

# One queue per publishing job, not per run: a run checks both channels, and a
# nightly must never wait behind a stable release (or the reverse). A running
# publisher is never cancelled; a newer pending job replaces an older pending one,
# which asks the same question later. The planning, build and matrix jobs only
# read, so two runs may build the same nightly; its publishing job asks again,
# right before it publishes, whether it is still the next one.

permissions:
  contents: write
  id-token: write
  actions: read

env:
  # `bun install` runs `prepare`, which wires the repo's git hooks, and job `promote`
  # pushes (the release tag and commit): the pre-push hook then
  # type-checked for 50s before a tag moved. Those hooks are for people.
  HUSKY: '0'
  # onnxruntime-node's install script fetches its CUDA provider (about 240 MB from
  # api.nuget.org) on every Linux x64 `bun install`; Walnut embeds on the CPU, as in
  # ci.yml. 2026-10-28: a nuget timeout failed a flake hunt leg before any test ran.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  # Stable by hand: a vX.Y.Z tag. Build it, run its files everywhere, publish them.
  stable-build:
    name: Build stable (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    # macOS: it signs the darwin files and builds the SQLite they carry.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      files: release-files-stable
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: The tag names the version package.json carries
        id: tag
        run: |
          version="$(bun -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but package.json is $version (cut releases with: bun run release -- <bump>)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A release commit only rolls the version and CHANGELOG, so its parent's CI
      # result is the one that counts; any other tagged commit needs its own.
      - name: CI and the binary matrix passed on the released code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun scripts/ci-gate.mjs release HEAD
      # bun's package store, shared by every job's install (tests/scripts/ci-bun-store.test.ts).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bun-store
          key: bun-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-store
      - run: bun run lint
      - name: Build the compiled files and their release assets
        run: bun scripts/release-build.mjs --version "${GITHUB_REF_NAME#v}" --out "$RUNNER_TEMP/release"
      # What jobs `stable-files` run and `stable` publishes: the .gz files and SHA256SUMS.
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-stable
          path: ${{ runner.temp }}/release/assets
          if-no-files-found: error
          # Already gzip.
          compression-level: 0
          # As long as GitHub lets a run be re-run, so "Re-run failed jobs" can finish a publish.
          retention-days: 30
          overwrite: true

  stable-files:
    name: The stable's files on every system
    needs: stable-build
    permissions:
      contents: read
    uses: ./.github/workflows/binary-matrix.yml
    with:
      files: ${{ needs.stable-build.outputs.files }}
      version: ${{ needs.stable-build.outputs.version }}
      ref: ${{ github.sha }}

  stable:
    name: Publish stable (${{ github.ref_name }})
    needs: [stable-build, stable-files]
    if: startsWith(github.ref, 'refs/tags/v')
    # Its own queue per tag: a pending tag publish is never replaced by another job.
    concurrency:
      group: release-tag-${{ github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # actions: write starts release-archives.yml (the one event this token may start).
    permissions:
      contents: write
      id-token: write
      actions: write
    env:
      VERSION: ${{ needs.stable-build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      # Publishing to npm (trusted publishing and its provenance) is npm's own, on Node;
      # Walnut's scripts around it run on bun.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm install -g npm@12
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.stable-build.outputs.files }}
          path: ${{ runner.temp }}/release/assets
      - name: The npm packages, of the very files the binary matrix ran
        run: |
          sh scripts/release-unpack.sh "$RUNNER_TEMP/release/assets" "$VERSION" "$RUNNER_TEMP/files"
          bun scripts/npm-packages.mjs build --files "$RUNNER_TEMP/files" --version "$VERSION" --out "$RUNNER_TEMP/release/npm" --git-head "$GITHUB_SHA"
      - name: Publish to npm (the platform packages, then open-walnut)
        run: bun scripts/npm-packages.mjs publish --dir "$RUNNER_TEMP/release/npm" --tag latest --provenance
      - name: Draft the GitHub Release with this version's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "the $TAG GitHub Release already exists"
          else
            bun scripts/release-notes.mjs "$VERSION" > release-notes.md
            gh release create "$TAG" --draft --title "Open Walnut $VERSION" --notes-file release-notes.md
          fi
      - name: Attach its files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/release-attach.sh "$TAG" "$RUNNER_TEMP/release/assets"
      - name: Publish the GitHub Release, now that it holds its files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # install.sh, the formula and the Mac app read releases/latest/download: a
          # release goes public only with its files on it. An earlier attempt may
          # have published it already; then it is left as it is.
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then
            echo "the $TAG GitHub Release is already published"
            exit 0
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "$assets" | grep -qx SHA256SUMS; then
            echo "::error::$TAG has no SHA256SUMS, so not all of its files are up: it stays a draft"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          echo "published the $TAG GitHub Release"
      - name: Its Homebrew formula, Mac app and Node archives (release-archives.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-archives.yml --ref main -f version="$VERSION"

  nightly-build:
    name: Build the nightly from main
    if: github.event_name == 'workflow_run' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel != 'stable')
    # macOS: it signs the darwin files and builds the SQLite they carry.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.pick.outputs.publish }}
      sha: ${{ steps.pick.outputs.sha }}
      version: ${{ steps.build.outputs.version }}
      files: release-files-nightly
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: The newest commit on main that CI passed, if it is new
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A check (CI finished, or the schedule) publishes only when the last nightly
          # is old enough; by hand, now.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(bun scripts/nightly-version.mjs due)" != "due=true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          green="$(bun scripts/ci-gate.mjs last-green main)"
          last="$(bun scripts/nightly-version.mjs last)"
          [ -n "$last" ] || last=none
          echo "newest green on main: ${green:-none}"
          echo "last nightly:         $last"
          if [ -z "$green" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "no recent commit on main passed CI; nothing to publish"
          elif ! git cat-file -e "$green:scripts/release-build.mjs" 2>/dev/null || ! git cat-file -e "$green:scripts/release-unpack.sh" 2>/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            # A commit from before this release pipeline (its build, and the unpack
            # the matrix and the publish run from its tree) has nothing these jobs can
            # build. Loud, so a run that keeps choosing one shows on the run's page.
            echo "::warning::the newest green commit found is $green, which predates the compiled file's release build; nothing published (last nightly $last)"
          elif [ "$last" = "$green" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "that commit is already the last nightly; nothing to publish"
          elif [ "${{ inputs.force }}" != "true" ] && [ "$last" != "none" ] && ! git merge-base --is-ancestor "$last" "$green"; then
            # The runs list can lag a finished run by a minute or two, so "newest green"
            # may be an older commit; a nightly must never move installs backwards
            # (`force` overrides, for a last nightly built on a rewritten history).
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$green is not newer than the last nightly ($last); nothing published"
          else
            git checkout --quiet "$green"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "sha=$green" >> "$GITHUB_OUTPUT"
          fi
      # bun's package store, shared by every job's install (tests/scripts/ci-bun-store.test.ts).
      - uses: actions/cache@v4
        if: steps.pick.outputs.publish == 'true'
        with:
          path: ${{ runner.temp }}/bun-store
          key: bun-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ runner.arch }}-
      - if: steps.pick.outputs.publish == 'true'
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-store
      - name: Version this nightly and build it
        if: steps.pick.outputs.publish == 'true'
        id: build
        run: |
          WALNUT_LATEST_STABLE="$(bun -e 'const r = await fetch("https://registry.npmjs.org/open-walnut/latest"); if (r.ok) console.log((await r.json()).version)' 2>/dev/null || true)"
          export WALNUT_LATEST_STABLE
          version="$(bun scripts/nightly-version.mjs)"
          echo "building open-walnut@$version from ${{ steps.pick.outputs.sha }}"
          bun scripts/release-build.mjs --version "$version" --out "$RUNNER_TEMP/release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # What jobs `nightly-files` run and `nightly` publishes.
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.publish == 'true'
        with:
          name: release-files-nightly
          path: ${{ runner.temp }}/release/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  nightly-files:
    name: The nightly's files on every system
    needs: nightly-build
    if: needs.nightly-build.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/binary-matrix.yml
    with:
      files: ${{ needs.nightly-build.outputs.files }}
      version: ${{ needs.nightly-build.outputs.version }}
      ref: ${{ needs.nightly-build.outputs.sha }}

  nightly:
    name: Publish nightly from main
    needs: [nightly-build, nightly-files]
    if: needs.nightly-build.outputs.publish == 'true'
    concurrency:
      group: release-nightly
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHA: ${{ needs.nightly-build.outputs.sha }}
      VERSION: ${{ needs.nightly-build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.nightly-build.outputs.sha }}
          fetch-depth: 0
      # Publishing to npm (trusted publishing and its provenance) is npm's own, on Node;
      # Walnut's scripts around it run on bun.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The pick ran before the build and the matrix; a run ahead in this queue may
      # have published since. So the pick's own rule, again, right before publishing:
      # never the same commit twice, never a commit older than the last nightly.
      - name: Still the next nightly
        id: recheck
        run: |
          last="$(bun scripts/nightly-version.mjs last)"
          [ -n "$last" ] || last=none
          echo "last nightly: $last"
          echo "this build:   $SHA ($VERSION)"
          if [ "$last" = "$SHA" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "that commit became the last nightly while this run built it; nothing to publish"
          elif [ "${{ inputs.force }}" != "true" ] && [ "$last" != "none" ] && ! git merge-base --is-ancestor "$last" "$SHA"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$SHA does not descend from the last nightly ($last), published while this run built it; nothing published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.recheck.outputs.publish == 'true'
        run: npm install -g npm@12
      - uses: actions/download-artifact@v4
        if: steps.recheck.outputs.publish == 'true'
        with:
          name: ${{ needs.nightly-build.outputs.files }}
          path: ${{ runner.temp }}/release/assets
      - name: The npm packages, of the very files the binary matrix ran
        if: steps.recheck.outputs.publish == 'true'
        run: |
          sh scripts/release-unpack.sh "$RUNNER_TEMP/release/assets" "$VERSION" "$RUNNER_TEMP/files"
          bun scripts/npm-packages.mjs build --files "$RUNNER_TEMP/files" --version "$VERSION" --out "$RUNNER_TEMP/release/npm" --git-head "$SHA"
      # The platform packages first, open-walnut last (npm-packages.mjs): its nightly
      # dist-tag is what the update check reads.
      - name: Publish it as nightly (the platform packages, then open-walnut)
        if: steps.recheck.outputs.publish == 'true'
        run: bun scripts/npm-packages.mjs publish --dir "$RUNNER_TEMP/release/npm" --tag nightly --provenance
      # The next run learns the last nightly from npm, and npm serves a version it
      # accepted only minutes later; this job's queue holds the next run's until
      # this step ends, so it never sees the nightly before this one.
      - name: Wait until npm serves it
        if: steps.recheck.outputs.publish == 'true'
        run: bun scripts/nightly-version.mjs wait "$VERSION"
      - if: steps.recheck.outputs.publish == 'true'
        run: echo "published open-walnut@$VERSION (dist-tag nightly) from $SHA"

  # Automatic stable: plan, then build the soaked nightly's commit at the stable
  # version and run those files everywhere, while a fresh-machine install of the
  # nightly itself runs beside it, then publish. A red matrix or smoke stops the
  # release (GitHub mails the failed run): nothing ships that a fresh install
  # could not start.
  promote-plan:
    name: Pick the nightly to promote
    if: github.event_name == 'workflow_run' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish == 'true' && steps.files.outputs.publish == 'true' }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      nightly: ${{ steps.plan.outputs.nightly }}
      allow_scripts: ${{ steps.allow.outputs.allow_scripts }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: The nightly that has been out 24 hours, if it carries something new
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Repository variable, an ISO time: automatic runs release nothing before
          # it (docs/reference/releasing.md). A run by hand is not held.
          STABLE_HOLD_UNTIL: ${{ github.event_name != 'workflow_dispatch' && vars.STABLE_HOLD_UNTIL || '' }}
        # By hand means now: no one-a-day gap. A dry run takes the newest nightly, soaked
        # or not, so the build, the matrix and the smoke can be tried on demand; it
        # never reaches job `promote`.
        run: bun scripts/stable-promote.mjs plan --notes "$RUNNER_TEMP/notes.md" ${{ github.event_name == 'workflow_dispatch' && '--min-gap-hours 0' || '' }} ${{ inputs.dry_run && '--soak-hours 0' || '' }} >> "$GITHUB_OUTPUT"
      # The updater's --allow-scripts list, from main (the candidate may predate the
      # script), for job promote-smoke, whose machine has only a user's Node and npm.
      - name: The --allow-scripts list the updater passes
        id: allow
        run: echo "allow_scripts=$(bun scripts/stable-promote.mjs allow-scripts)" >> "$GITHUB_OUTPUT"
      # Job `promote-build` builds the compiled file from the nightly's commit, and the
      # matrix and the publish unpack it with that commit's scripts; a nightly from
      # before them has nothing to build, so the stable waits for one that has.
      - name: The nightly's commit builds the compiled file
        id: files
        if: steps.plan.outputs.publish == 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          if git cat-file -e "$SHA:scripts/release-build.mjs" 2>/dev/null && git cat-file -e "$SHA:scripts/release-unpack.sh" 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the soaked nightly ($SHA) predates the compiled file's release build; the stable waits for a nightly that has it"
          fi
      - if: steps.files.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          overwrite: true

  promote-build:
    name: Build ${{ needs.promote-plan.outputs.version }} from ${{ needs.promote-plan.outputs.nightly }}
    needs: promote-plan
    if: needs.promote-plan.outputs.publish == 'true'
    # macOS: it signs the darwin files and builds the SQLite they carry.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      files: release-files-promote
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.promote-plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # bun's package store, shared by every job's install (tests/scripts/ci-bun-store.test.ts).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bun-store
          key: bun-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-store
      - name: Build the compiled files at this version
        env:
          VERSION: ${{ needs.promote-plan.outputs.version }}
        run: bun scripts/release-build.mjs --version "$VERSION" --out "$RUNNER_TEMP/release"
      # What jobs `promote-files` run and `promote` publishes.
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-promote
          path: ${{ runner.temp }}/release/assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  promote-files:
    name: The files of ${{ needs.promote-plan.outputs.version }} on every system
    needs: [promote-plan, promote-build]
    if: needs.promote-plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/binary-matrix.yml
    with:
      files: ${{ needs.promote-build.outputs.files }}
      version: ${{ needs.promote-plan.outputs.version }}
      ref: ${{ needs.promote-plan.outputs.sha }}

  promote-smoke:
    name: ${{ needs.promote-plan.outputs.nightly }} installs and starts (${{ matrix.os }})
    needs: promote-plan
    if: needs.promote-plan.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      # main, for the npm-registry-lag wrapper. A user's machine: Node and npm, no bun
      # (promote-plan worked out the allow list).
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g npm@12
      # The updater's own command (src/core/self-update/install-kind.ts), run outside
      # the checkout so the repo's .npmrc plays no part, on a HOME nothing ran in.
      - name: Install it the way the updater does, start it on a fresh HOME, require it to answer
        env:
          NIGHTLY: ${{ needs.promote-plan.outputs.nightly }}
          ALLOW_SCRIPTS: ${{ needs.promote-plan.outputs.allow_scripts }}
        run: |
          allow="$ALLOW_SCRIPTS"
          cd "$RUNNER_TEMP"
          # Again while npm names a dependency it does not serve yet (a publish in flight).
          node "$GITHUB_WORKSPACE/scripts/npm-registry-lag.mjs" npm install -g "open-walnut@$NIGHTLY" --allow-scripts="$allow"
          open-walnut --version | tee version.txt
          grep -qF "$NIGHTLY" version.txt || { echo "::error::installed open-walnut does not report $NIGHTLY"; exit 1; }
          mkdir -p home
          HOME="$RUNNER_TEMP/home" open-walnut web --port 3457 > start.log 2>&1 &
          start_pid=$!
          for i in $(seq 1 300); do
            if curl -fsS --max-time 2 http://127.0.0.1:3457/api/system/health > health.json 2>/dev/null; then
              echo "$NIGHTLY answered after ${i}s"; cat health.json; echo
              curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:3457/
              # This VM is ours alone; never a pid <= 1.
              for p in $(lsof -tiTCP:3457 -sTCP:LISTEN 2>/dev/null) "$start_pid"; do
                [ "$p" -gt 1 ] 2>/dev/null && kill -TERM "$p" 2>/dev/null || true
              done
              exit 0
            fi
            if ! kill -0 "$start_pid" 2>/dev/null; then
              echo "::error::open-walnut web exited before serving"; tail -n 60 start.log; exit 1
            fi
            sleep 1
          done
          echo "::error::$NIGHTLY never answered within 300s"; tail -n 60 start.log
          [ "$start_pid" -gt 1 ] && kill -TERM "$start_pid" 2>/dev/null || true
          exit 1


  promote:
    name: Promote ${{ needs.promote-plan.outputs.nightly }} to ${{ needs.promote-plan.outputs.version }}
    needs: [promote-plan, promote-build, promote-files, promote-smoke]
    if: needs.promote-plan.outputs.publish == 'true' && !inputs.dry_run
    # Two runs can plan the same release; the second waits here, then finds every
    # step done (each one skips what is already out) and changes nothing.
    concurrency:
      group: release-promote
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # actions: write starts release-archives.yml (the one event this token may start).
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.promote-plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.promote-build.outputs.files }}
          path: ${{ runner.temp }}/release/assets
      # Publishing to npm (trusted publishing and its provenance) is npm's own, on Node;
      # Walnut's scripts around it run on bun.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm install -g npm@12
      # Every step below skips what an earlier attempt already did, so "Re-run failed
      # jobs" finishes a release that stopped halfway (npm refuses a version twice,
      # and the next plan sees the version out and would never come back for the
      # tag, the GitHub Release or main). tests/scripts/release-promote-steps.test.ts
      # runs these scripts against a scratch repository.
      - name: The npm packages, of the very files the binary matrix ran
        env:
          VERSION: ${{ needs.promote-plan.outputs.version }}
          SHA: ${{ needs.promote-plan.outputs.sha }}
        run: |
          sh scripts/release-unpack.sh "$RUNNER_TEMP/release/assets" "$VERSION" "$RUNNER_TEMP/files"
          bun scripts/npm-packages.mjs build --files "$RUNNER_TEMP/files" --version "$VERSION" --out "$RUNNER_TEMP/release/npm" --git-head "$SHA"
      # npm-packages.mjs skips each package npm already has. npm holds a version it
      # accepted for minutes before it serves it, so that check misses a publish still
      # in that state: one this job made before it stopped, or (before the wait step
      # below) one the run ahead in the queue made. 2026-10-09: two runs planned 0.6.7
      # two minutes apart and the second got 409 "Cannot publish over previously staged
      # version". npm's refusal of this very version is its word that the version is
      # taken; the tag step still requires the tag on this release's commit.
      - name: Publish it as latest (the platform packages, then open-walnut)
        run: bun scripts/npm-packages.mjs publish --dir "$RUNNER_TEMP/release/npm" --tag latest --provenance
      # The run queued behind this job asks npm, with the check above, whether the
      # version is out, so this job ends only once that check would say yes.
      - name: Wait until npm serves it
        env:
          VERSION: ${{ needs.promote-plan.outputs.version }}
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 30 -H 'cache-control: no-cache' "https://registry.npmjs.org/open-walnut/$VERSION"; then
              echo "npm serves open-walnut@$VERSION"; exit 0
            fi
            sleep 30
          done
          echo "::error::npm did not serve open-walnut@$VERSION within 30 minutes"; exit 1
      # Pushed with the job's token, so neither the tag nor the commit below starts a
      # workflow: the tag cannot publish a second time through job `stable`. The
      # GitHub Release opens as a draft: it goes public once its files are on it.
      - name: Tag it and draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.promote-plan.outputs.version }}
          SHA: ${{ needs.promote-plan.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tagged=""
          if git fetch --quiet --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION" 2> /dev/null; then
            tagged="$(git rev-parse "v$VERSION^{commit}")"
          fi
          if [ -z "$tagged" ]; then
            # This token may create the tag only on a commit whose .github/workflows
            # match main's tip (see the top of this file). When main's workflows
            # moved on since $SHA, the tag goes on a child of $SHA with $SHA's tree
            # and main's workflows: the same package source, as workflows never ship.
            for attempt in 1 2 3 4 5; do
              git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
              target="$SHA"
              if ! git diff --quiet "$SHA" origin/main -- .github/workflows; then
                index="$RUNNER_TEMP/release-tag-index"
                rm -f "$index"
                GIT_INDEX_FILE="$index" git read-tree "$SHA"
                GIT_INDEX_FILE="$index" git rm -r -q --cached --ignore-unmatch .github/workflows
                GIT_INDEX_FILE="$index" git read-tree --prefix=.github/workflows/ "origin/main:.github/workflows"
                target="$(git commit-tree "$(GIT_INDEX_FILE="$index" git write-tree)" -p "$SHA" \
                  -m "release: $VERSION" \
                  -m "The source of open-walnut@$VERSION, built from $SHA. Its .github/workflows are main's at $(git rev-parse origin/main), so that the release job's token may tag it.")"
              fi
              git tag -f -a "v$VERSION" -m "Open Walnut $VERSION" "$target"
              if git push origin "refs/tags/v$VERSION"; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::GitHub refused the v$VERSION tag five times"; exit 1; fi
              echo "the tag push was refused (main may have moved); trying again ($attempt)"
              sleep $((attempt * 5))
            done
          elif [ "$tagged" != "$SHA" ] && ! { [ "$(git rev-parse "$tagged^")" = "$SHA" ] && git diff --quiet "$SHA" "$tagged" -- . ':!.github/workflows'; }; then
            echo "::error::v$VERSION already exists on $tagged, not on $SHA"; exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "the v$VERSION GitHub Release already exists"
          else
            gh release create "v$VERSION" --draft --title "Open Walnut $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Attach its files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.promote-plan.outputs.version }}
        run: sh scripts/release-attach.sh "$TAG" "$RUNNER_TEMP/release/assets"
      - name: Publish the GitHub Release, now that it holds its files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.promote-plan.outputs.version }}
        run: |
          # install.sh, the formula and the Mac app read releases/latest/download: a
          # release goes public only with its files on it. An earlier attempt may
          # have published it already; then it is left as it is.
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$draft" != true ]; then
            echo "the $TAG GitHub Release is already published"
            exit 0
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "$assets" | grep -qx SHA256SUMS; then
            echo "::error::$TAG has no SHA256SUMS, so not all of its files are up: it stays a draft"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
          echo "published the $TAG GitHub Release"
      # The package is out; this only keeps main's CHANGELOG and version in step. A
      # failure here is red, not a warning: left alone, the next stable's notes would
      # repeat this one's.
      - name: Roll CHANGELOG and package.json on main
        env:
          VERSION: ${{ needs.promote-plan.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
            git checkout --quiet -B main origin/main
            if grep -qF "## [$VERSION]" CHANGELOG.md; then echo "main already says $VERSION"; exit 0; fi
            bun scripts/stable-promote.mjs roll --version "$VERSION" --notes "$RUNNER_TEMP/notes.md"
            git commit --quiet -am "release: $VERSION"
            if git push --quiet origin main; then echo "main now says $VERSION"; exit 0; fi
            echo "main moved during the push; trying again ($attempt)"
            sleep $((attempt * 5))
          done
          echo "::error::open-walnut@$VERSION is published, but main's CHANGELOG and package.json were not rolled"
          exit 1
      # Last, so a failure here never holds up main's roll, and after the release is
      # public: every job it starts reads the release's files. A re-run starts it only
      # while the release has no formula (release-archives.yml attaches it).
      - name: Its Homebrew formula, Mac app and Node archives (release-archives.yml)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.promote-plan.outputs.version }}
        run: |
          assets="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -qx open-walnut.rb; then
            echo "v$VERSION already has its formula"
          else
            gh workflow run release-archives.yml --ref main -f version="$VERSION"
            echo "started release-archives.yml for $VERSION"
          fi
