name: Release

# Two channels, one workflow (docs/reference/releasing.md):
#
#   stable   automatic, once a day (jobs `promote-*`, checked when CI finishes on
#            main and hourly): the newest nightly that has been out 24 hours,
#            when it carries something new and installs and starts on fresh
#            Linux and macOS runners, becomes the next patch (pre-1.0; a
#            breaking change makes the next minor). Published as dist-tag `latest`,
#            tagged `vX.Y.Z`, a GitHub Release with its notes, then a
#            `release: X.Y.Z` commit on main rolls CHANGELOG and package.json
#            (scripts/stable-promote.mjs). By hand, a `vX.Y.Z` tag cut with
#            `npm run release -- patch|minor|major` publishes through job `stable`.
#   nightly  about every six hours (checked when CI finishes on main and every 30
#            minutes; and by hand): the newest commit on main that CI passed,
#            when it is not the last nightly. Published as
#            `X.Y.(Z+1)-nightly.YYYYMMDD.N` under dist-tag `nightly`, then the
#            `nightly` tag moves to it. Nothing is committed: the version lives in
#            the registry, not in package.json.
#
# Both channels publish only commits CI passed (scripts/ci-gate.mjs reads the CI
# workflow's `CI OK` job), because every npm install updates itself on restart.
# The nightly does not rerun the tests: CI already ran them on that exact commit.
#
# Authentication is npm trusted publishing (OIDC): no token is stored anywhere.
# One-time setup on npmjs.com, package open-walnut > Settings > Trusted publisher:
# GitHub Actions, owner EvanZhang008, repository open-walnut, workflow release.yml.
# `--provenance` attaches the build attestation npm shows on the package page.
# Trusted publishing needs npm 11.5.1 or newer, so the job updates npm first. It
# pins the major: npm 12 changed install defaults (tarball URL dependencies and
# dependency install scripts, docs/reference/releasing.md "npm 12") and stopped
# the 0.6.0 publish, so a new major is taken on purpose.

on:
  push:
    tags: ['v*.*.*']
  # The checks only ask, and a gap decides: a nightly when the last one is 5.5h old
  # (scripts/nightly-version.mjs due), a stable when the last one is 23h old
  # (scripts/stable-promote.mjs plan). They ask whenever CI finishes on main,
  # which is when there is something new to ship, and on a schedule as a backup.
  # Schedules alone were not enough: GitHub ran this repo's 17:17 cron at 21:48
  # (2026-10-01) and none of the next 5 hours of half-hourly ones.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Off the hour, which GitHub drops most. The jobs compare
    # github.event.schedule to these strings.
    - cron: '17,47 * * * *'   # nightly check, every 30 minutes
    - cron: '37 * * * *'      # stable promotion check, hourly
  workflow_dispatch:
    inputs:
      channel:
        description: 'nightly: publish main now. stable: promote the soaked nightly now.'
        type: choice
        options: [nightly, stable]
        default: nightly
      force:
        description: 'Publish a nightly even when main has not moved since the last one'
        type: boolean
        default: false
      dry_run:
        description: 'stable: plan and smoke-test the newest nightly now (no 24h soak), publish nothing'
        type: boolean
        default: false

# One queue per channel: a nightly never waits behind a stable release (or the
# reverse), and a running publisher is never cancelled. Inside a channel a newer
# pending run replaces an older pending one, which is what a nightly wants.
concurrency:
  group: release-${{ (github.event.schedule == '37 * * * *' || inputs.channel == 'stable' || startsWith(github.ref, 'refs/tags/')) && 'stable' || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read

env:
  # `npm ci` runs `prepare`, which wires the repo's git hooks, and the jobs push
  # (the nightly tag, the release commit and tag): the pre-push hook then
  # type-checked for 50s before a tag moved. Those hooks are for people.
  HUSKY: '0'

jobs:
  stable:
    name: Publish stable (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: The tag names the version package.json carries
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but package.json is $version (cut releases with: npm run release -- <bump>)" >&2
            exit 1
          fi
      # A release commit only rolls the version and CHANGELOG, so its parent's CI
      # result is the one that counts; any other tagged commit needs its own.
      - name: CI passed on the released code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci-gate.mjs release HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run lint
      # prepublishOnly builds (WALNUT_REQUIRE_BUN=1) and runs scripts/check-publish.mjs
      # against the tarball before anything leaves the runner.
      - run: npm publish --provenance --access public
      - name: GitHub Release with this version's CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "Open Walnut ${version}" --notes-file release-notes.md

  nightly:
    name: Publish nightly from main
    if: github.event_name == 'workflow_run' || (github.event_name == 'schedule' && github.event.schedule == '17,47 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.channel != 'stable')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The newest commit on main that CI passed, if it is new
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A check (CI finished, or the schedule) publishes only when the last nightly
          # is old enough; by hand, now.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(node scripts/nightly-version.mjs due)" != "due=true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          green="$(node scripts/ci-gate.mjs last-green main)"
          git fetch --quiet origin 'refs/tags/nightly:refs/tags/nightly' 2>/dev/null || true
          last="$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' 2>/dev/null || echo none)"
          echo "newest green on main: ${green:-none}"
          echo "last nightly:         $last"
          if [ -z "$green" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "no recent commit on main passed CI; nothing to publish"
          elif ! git cat-file -e "$green:scripts/nightly-version.mjs" 2>/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$green predates the nightly pipeline; nothing to publish"
          elif [ "$last" = "$green" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "that commit is already the last nightly; nothing to publish"
          elif [ "${{ inputs.force }}" != "true" ] && [ "$last" != "none" ] && ! git merge-base --is-ancestor "$last" "$green"; then
            # The runs list can lag a finished run by a minute or two, so "newest green"
            # may be an older commit; a nightly must never move installs backwards
            # (`force` overrides, for a nightly tag left on a rewritten history).
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$green is not newer than the last nightly; nothing to publish"
          else
            git checkout --quiet "$green"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "sha=$green" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.pick.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: steps.pick.outputs.publish == 'true'
        with:
          bun-version: latest
      - if: steps.pick.outputs.publish == 'true'
        run: npm install -g npm@12
      - if: steps.pick.outputs.publish == 'true'
        run: npm ci
      # prepublishOnly builds (WALNUT_REQUIRE_BUN=1) and runs scripts/check-publish.mjs.
      - name: Version this nightly and publish it
        if: steps.pick.outputs.publish == 'true'
        id: publish
        env:
          # The version stamp below is the only edit; the build must not call itself dirty.
          WALNUT_VERSION_STAMPED: '1'
        run: |
          WALNUT_LATEST_STABLE="$(npm view open-walnut@latest version 2>/dev/null || true)"
          export WALNUT_LATEST_STABLE
          version="$(node scripts/nightly-version.mjs)"
          echo "publishing open-walnut@$version from ${{ steps.pick.outputs.sha }}"
          npm version "$version" --no-git-tag-version
          npm publish --tag nightly --provenance --access public
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Move the nightly tag to this commit
        if: steps.pick.outputs.publish == 'true'
        run: |
          git tag -f nightly "${{ steps.pick.outputs.sha }}"
          git push --force origin refs/tags/nightly
      - if: steps.pick.outputs.publish == 'true'
        run: echo "published open-walnut@${{ steps.publish.outputs.version }} (dist-tag nightly) from ${{ steps.pick.outputs.sha }}"

  # Automatic stable: plan, then a fresh-machine install of the soaked nightly, then
  # publish. A red smoke stops the release (GitHub mails the failed run): nothing
  # ships that a fresh install could not start.
  promote-plan:
    name: Pick the nightly to promote
    if: github.event_name == 'workflow_run' || (github.event_name == 'schedule' && github.event.schedule == '37 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      nightly: ${{ steps.plan.outputs.nightly }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The nightly that has been out 24 hours, if it carries something new
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # By hand means now: no one-a-day gap. A dry run takes the newest nightly, soaked
        # or not, so the smoke can be tried on demand; it never reaches job `promote`.
        run: node scripts/stable-promote.mjs plan --notes "$RUNNER_TEMP/notes.md" ${{ github.event_name == 'workflow_dispatch' && '--min-gap-hours 0' || '' }} ${{ inputs.dry_run && '--soak-hours 0' || '' }} >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  promote-smoke:
    name: ${{ needs.promote-plan.outputs.nightly }} installs and starts (${{ matrix.os }})
    needs: promote-plan
    if: needs.promote-plan.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # main, for the script and the allow list (the candidate may predate the script).
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g npm@12
      # The updater's own command (src/core/self-update/install-kind.ts), run outside
      # the checkout so the repo's .npmrc plays no part, on a HOME nothing ran in.
      - name: Install it the way the updater does, start it on a fresh HOME, require it to answer
        env:
          NIGHTLY: ${{ needs.promote-plan.outputs.nightly }}
        run: |
          allow="$(node scripts/stable-promote.mjs allow-scripts)"
          cd "$RUNNER_TEMP"
          npm install -g "open-walnut@$NIGHTLY" --allow-scripts="$allow"
          open-walnut --version | tee version.txt
          grep -qF "$NIGHTLY" version.txt || { echo "::error::installed open-walnut does not report $NIGHTLY"; exit 1; }
          mkdir -p home
          HOME="$RUNNER_TEMP/home" open-walnut web --port 3457 > start.log 2>&1 &
          start_pid=$!
          for i in $(seq 1 300); do
            if curl -fsS --max-time 2 http://127.0.0.1:3457/api/system/health > health.json 2>/dev/null; then
              echo "$NIGHTLY answered after ${i}s"; cat health.json; echo
              curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:3457/
              # This VM is ours alone; never a pid <= 1.
              for p in $(lsof -tiTCP:3457 -sTCP:LISTEN 2>/dev/null) "$start_pid"; do
                [ "$p" -gt 1 ] 2>/dev/null && kill -TERM "$p" 2>/dev/null || true
              done
              exit 0
            fi
            if ! kill -0 "$start_pid" 2>/dev/null; then
              echo "::error::open-walnut web exited before serving"; tail -n 60 start.log; exit 1
            fi
            sleep 1
          done
          echo "::error::$NIGHTLY never answered within 300s"; tail -n 60 start.log
          [ "$start_pid" -gt 1 ] && kill -TERM "$start_pid" 2>/dev/null || true
          exit 1

  promote:
    name: Promote ${{ needs.promote-plan.outputs.nightly }} to ${{ needs.promote-plan.outputs.version }}
    needs: [promote-plan, promote-smoke]
    if: needs.promote-plan.outputs.publish == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.promote-plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm install -g npm@12
      - run: npm ci
      # Every step below skips what an earlier attempt already did, so "Re-run failed
      # jobs" finishes a release that stopped halfway (npm refuses a version twice,
      # and the next plan sees the version out and would never come back for the
      # tag, the GitHub Release or main). tests/scripts/release-promote-steps.test.ts
      # runs these three scripts against a scratch repository.
      # prepublishOnly builds (WALNUT_REQUIRE_BUN=1) and runs scripts/check-publish.mjs.
      - name: Version it and publish it as latest
        env:
          WALNUT_VERSION_STAMPED: '1'
          VERSION: ${{ needs.promote-plan.outputs.version }}
        run: |
          if curl -fsS -o /dev/null --max-time 30 -H 'cache-control: no-cache' "https://registry.npmjs.org/open-walnut/$VERSION"; then
            echo "open-walnut@$VERSION is already on npm; not publishing it again"
          else
            npm version "$VERSION" --no-git-tag-version
            npm publish --provenance --access public
          fi
      # Pushed with the job's token, so neither the tag nor the commit below starts a
      # workflow: the tag cannot publish a second time through job `stable`.
      - name: Tag it and open the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.promote-plan.outputs.version }}
          SHA: ${{ needs.promote-plan.outputs.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tagged=""
          if git fetch --quiet --force origin "refs/tags/v$VERSION:refs/tags/v$VERSION" 2> /dev/null; then
            tagged="$(git rev-parse "v$VERSION^{commit}")"
          fi
          if [ -z "$tagged" ]; then
            git tag -f -a "v$VERSION" -m "Open Walnut $VERSION" "$SHA"
            git push origin "refs/tags/v$VERSION"
          elif [ "$tagged" != "$SHA" ]; then
            echo "::error::v$VERSION already exists on $tagged, not on $SHA"; exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "the v$VERSION GitHub Release already exists"
          else
            gh release create "v$VERSION" --title "Open Walnut $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      # The package is out; this only keeps main's CHANGELOG and version in step. A
      # failure here is red, not a warning: left alone, the next stable's notes would
      # repeat this one's.
      - name: Roll CHANGELOG and package.json on main
        env:
          VERSION: ${{ needs.promote-plan.outputs.version }}
        run: |
          git checkout --quiet -- .
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
            git checkout --quiet -B main origin/main
            if grep -qF "## [$VERSION]" CHANGELOG.md; then echo "main already says $VERSION"; exit 0; fi
            node scripts/stable-promote.mjs roll --version "$VERSION" --notes "$RUNNER_TEMP/notes.md"
            git commit --quiet -am "release: $VERSION"
            if git push --quiet origin main; then echo "main now says $VERSION"; exit 0; fi
            echo "main moved during the push; trying again ($attempt)"
            sleep $((attempt * 5))
          done
          echo "::error::open-walnut@$VERSION is published, but main's CHANGELOG and package.json were not rolled"
          exit 1
