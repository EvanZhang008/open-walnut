name: Flake hunt

# Every commit CI passes on main runs its blocking test tiers a SECOND time,
# here. A failure on a commit that just passed is a flake by definition, and a
# flake is what turns a later, innocent push red (2026-10-02: an inode the
# filesystem reused within one millisecond; 10-03: a log flush racing a
# directory removal). Found on a green commit, it is fixed before it costs one.
#
# Never red: a flake belongs to the test, not to this commit, so a leg that
# finds one stays green and writes warning annotations instead
# (scripts/flake-report.mjs). The release watch reads them and wakes the
# session that owns the pipeline. The legs use CI's own settings (the same
# shards, workers, retries and baselines), so a finding is a failure CI itself
# could have hit on that commit.
#
# No concurrency group: a superseded hunt would end "cancelled", and every
# green commit is worth its own second sample.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to hunt on (default the branch head)
        required: false

permissions:
  contents: read

jobs:
  hunt:
    name: Hunt (${{ matrix.leg }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A setup step that breaks (npm, a runner) is not this commit's fault either.
    continue-on-error: true
    strategy:
      fail-fast: false
      # Leaves runner slots for the next push's CI.
      max-parallel: 3
      matrix:
        include:
          - { leg: quick 1/3, build: plugins, config: vitest.quick.config.ts, baseline: tests/setup/known-failures.json, min: '1400', args: --maxWorkers=1 --shard=1/3 }
          - { leg: quick 2/3, build: plugins, config: vitest.quick.config.ts, baseline: tests/setup/known-failures.json, min: '1400', args: --maxWorkers=1 --shard=2/3 }
          - { leg: quick 3/3, build: plugins, config: vitest.quick.config.ts, baseline: tests/setup/known-failures.json, min: '1400', args: --maxWorkers=1 --shard=3/3 }
          - { leg: e2e 1/4, build: all, config: vitest.e2e.config.ts, baseline: tests/setup/known-failures-e2e.json, min: '120', args: --maxWorkers=1 --retry=2 --shard=1/4 }
          - { leg: e2e 2/4, build: all, config: vitest.e2e.config.ts, baseline: tests/setup/known-failures-e2e.json, min: '120', args: --maxWorkers=1 --retry=2 --shard=2/4 }
          - { leg: e2e 3/4, build: all, config: vitest.e2e.config.ts, baseline: tests/setup/known-failures-e2e.json, min: '120', args: --maxWorkers=1 --retry=2 --shard=3/4 }
          - { leg: e2e 4/4, build: all, config: vitest.e2e.config.ts, baseline: tests/setup/known-failures-e2e.json, min: '120', args: --maxWorkers=1 --retry=2 --shard=4/4 }
          # The slow tier has no known failures, so its baseline is an empty one.
          - { leg: slow, build: all, config: vitest.slow.config.ts, baseline: '', min: '50', args: --maxWorkers=1 --retry=2 }
    env:
      WALNUT_BASELINE_CONFIG: ${{ matrix.config }}
      WALNUT_BASELINE_MIN_FILES: ${{ matrix.min }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - if: matrix.build == 'plugins'
        run: npm run build:plugins
      - if: matrix.build == 'all'
        run: npm run build
      - name: ${{ matrix.leg }} tests, again
        id: tests
        continue-on-error: true
        # The runner context is a step's, not a job's, so the paths live here.
        env:
          WALNUT_BASELINE_FILE: ${{ matrix.baseline || format('{0}/no-known-failures.json', runner.temp) }}
          WALNUT_BASELINE_RUN_OUT: ${{ runner.temp }}/flake-hunt-run.json
        run: |
          [ -n "${{ matrix.baseline }}" ] || echo '{"failures":[]}' > "$WALNUT_BASELINE_FILE"
          # What CI's slow and e2e jobs set and its quick legs do not.
          if [ "${{ matrix.build }}" = all ]; then
            export WALNUT_DAEMON_DIR="$RUNNER_TEMP/open-walnut-hunt"
            export GIT_AUTHOR_NAME="Open Walnut CI" GIT_AUTHOR_EMAIL=open-walnut@localhost
            export GIT_COMMITTER_NAME="Open Walnut CI" GIT_COMMITTER_EMAIL=open-walnut@localhost
          fi
          node scripts/test-baseline.mjs check ${{ matrix.args }}
      - name: Report what the rerun found
        if: always()
        env:
          WALNUT_BASELINE_FILE: ${{ matrix.baseline || format('{0}/no-known-failures.json', runner.temp) }}
          WALNUT_BASELINE_RUN_OUT: ${{ runner.temp }}/flake-hunt-run.json
        run: >-
          node scripts/flake-report.mjs --label "${{ matrix.leg }}" --outcome "${{ steps.tests.outcome }}"
          --run "$WALNUT_BASELINE_RUN_OUT" --baseline "$WALNUT_BASELINE_FILE"
