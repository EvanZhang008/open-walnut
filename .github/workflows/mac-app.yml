name: Mac app

# Walnut.app for macOS, signed with the project's Developer ID, notarized by
# Apple, stapled, in one DMG per Mac architecture attached to the release:
# Walnut-arm64.dmg (Apple silicon) and Walnut-x64.dmg (Intel), the install that
# is one click (releases/latest/download/Walnut-<arch>.dmg), with the Homebrew
# cask that picks one (walnut.rb). Each app carries the release's
# self-contained archive for its architecture (scripts/desktop-carry-release.mjs),
# so its first launch installs Walnut with no network, with the install.sh it
# carries (desktop/BundledRuntime.swift). So release-archives.yml calls this
# once the archives are attached, and each app must start and serve the console
# (scripts/desktop-smoke.mjs) before it is attached: the Apple silicon one from
# what it carries, the Intel one (on this Apple silicon runner) by downloading
# the arm64 build, as it does on such a Mac.
#
# The signing material lives only in the `release` environment, which only main
# may use (Settings, Environments):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_P12_PASSWORD
#       the Developer ID Application identity (certificate and private key)
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#       an App Store Connect API key with the Developer role, for notarytool
# The identity goes into a keychain made for this job and deleted after it.
# Without them the apps are built ad-hoc signed and kept as workflow artifacts,
# never attached: an app that is not notarized does not open from a browser
# download on macOS 15 and later.
#
# By hand: dispatch with a released version that has its archives. To try the
# app of a later commit on a released Walnut before any release carries it,
# also give `app_ref`: it is built, signed, notarized and launched the same
# way, and never attached.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      attach:
        type: boolean
        default: true
      app_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'A released stable version (x.y.z) whose archives are attached'
        required: true
        type: string
      attach:
        description: 'Attach the DMGs and the cask to the release'
        type: boolean
        default: true
      app_ref:
        description: 'Build the app from this commit instead of the release tag (a trial: never attached)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mac-app-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  app:
    name: Walnut.app ${{ inputs.version }} (${{ matrix.arch }})
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    outputs:
      app: ${{ steps.shape.outputs.app }}
      signed: ${{ steps.signing.outputs.signed }}
    env:
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A trial of another commit's app is never attached to the release.
      ATTACH: ${{ inputs.attach && inputs.app_ref == '' }}
    steps:
      # The release's own app and install.sh (or, for a trial, that commit's).
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.app_ref || format('v{0}', inputs.version) }}
      # The checks that judge it come from this workflow's own commit, as the
      # workflow does: a fix to the smoke must reach every release it checks
      # (2026-10-07: two smoke fixes on main never ran, the job used v0.6.5's).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: This release has the app that carries its own Walnut
        id: shape
        run: |
          case "$VERSION" in
            *[!0-9.]* | '' ) echo "::error::$VERSION is not a stable version (x.y.z)"; exit 1 ;;
          esac
          if [ -f desktop/BundledRuntime.swift ] && [ -f scripts/desktop-carry-release.mjs ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION predates the Mac app that carries its Walnut; nothing to build"
          fi
      - name: The app's pure-logic tests
        if: steps.shape.outputs.app == 'true'
        run: bash scripts/test-desktop.sh
      - name: The release's archive for ${{ matrix.arch }} and its checksums
        if: steps.shape.outputs.app == 'true'
        run: |
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/release" --clobber \
            --pattern "open-walnut-$VERSION-darwin-$ARCH.tar.gz" --pattern SHA256SUMS
          echo "WALNUT_APP_RUNTIME=$RUNNER_TEMP/release/open-walnut-$VERSION-darwin-$ARCH.tar.gz" >> "$GITHUB_ENV"
          echo "WALNUT_APP_RUNTIME_SUMS=$RUNNER_TEMP/release/SHA256SUMS" >> "$GITHUB_ENV"
      - name: Signing identity and notary key, from the release environment
        id: signing
        if: steps.shape.outputs.app == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ] || [ -z "$P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing identity or notary key in the release environment: building an ad-hoc app that is not attached."
            exit 0
          fi
          keychain="$RUNNER_TEMP/walnut-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 -D > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identity.p12"
          # codesign may use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # On the search list too: codesign builds the certificate chain from it.
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::MACOS_CERT_P12_BASE64 holds no Developer ID Application identity"; exit 1; }
          printf '%s' "$P8" | base64 -D > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"
          {
            echo "WALNUT_SIGN_IDENTITY=$identity"
            echo "WALNUT_SIGN_KEYCHAIN=$keychain"
            echo "WALNUT_REQUIRE_DEVELOPER_ID=1"
            echo "WALNUT_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "WALNUT_NOTARY_KEY_ID=$KEY_ID"
            echo "WALNUT_NOTARY_ISSUER=$ISSUER"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing as: $identity"
      - name: Build Walnut.app and Walnut-${{ matrix.arch }}.dmg (signed, notarized and stapled when signed)
        if: steps.shape.outputs.app == 'true'
        run: |
          WALNUT_APP_VERSION="$VERSION" bash desktop/build-release.sh
          [ -f "desktop/Walnut-$ARCH.dmg" ] || { echo "::error::the build made no desktop/Walnut-$ARCH.dmg"; exit 1; }
      - name: Gatekeeper opens it the way it opens a browser download
        if: steps.signing.outputs.signed == 'true'
        run: |
          cp "desktop/Walnut-$ARCH.dmg" "$RUNNER_TEMP/download.dmg"
          # The quarantine mark a browser puts on a download: what Gatekeeper checks.
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$RUNNER_TEMP/download.dmg"
          spctl -a -vv -t open --context context:primary-signature "$RUNNER_TEMP/download.dmg"
          mkdir -p "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/Applications"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/download.dmg"
          spctl -a -vv "$RUNNER_TEMP/mnt/Walnut.app" 2>&1 | tee "$RUNNER_TEMP/assess.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/assess.txt" || { echo "::error::Gatekeeper does not see a notarized Developer ID app"; exit 1; }
          xcrun stapler validate "$RUNNER_TEMP/mnt/Walnut.app"
          ditto "$RUNNER_TEMP/mnt/Walnut.app" "$RUNNER_TEMP/Applications/Walnut.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
      - name: First launch installs v${{ inputs.version }} and serves the console, with no Node
        if: steps.shape.outputs.app == 'true'
        run: |
          app="$RUNNER_TEMP/Applications/Walnut.app"
          [ -d "$app" ] || app="desktop/Walnut.app"
          node harness/scripts/desktop-smoke.mjs --app "$app" --version "$VERSION" --work "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: steps.shape.outputs.app == 'true' && !cancelled()
        with:
          name: Walnut-${{ inputs.version }}-${{ matrix.arch }}-dmg
          path: desktop/Walnut-${{ matrix.arch }}.dmg
          if-no-files-found: ignore
          retention-days: 14
      - name: Attach Walnut-${{ matrix.arch }}.dmg to v${{ inputs.version }}
        if: steps.signing.outputs.signed == 'true' && env.ATTACH == 'true'
        run: gh release upload "v$VERSION" "desktop/Walnut-$ARCH.dmg" --clobber
      - name: Remove the signing keychain and key
        if: always()
        run: |
          if [ -n "${WALNUT_SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$WALNUT_SIGN_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/identity.p12"

  # The cask is written from the two DMGs the release now holds, installed from
  # GitHub with brew as a user does, and attached as walnut.rb. The tap
  # (EvanZhang008/homebrew-tap) copies the newest release's walnut.rb into
  # Casks/: brew install --cask evanzhang008/tap/walnut.
  cask:
    name: Homebrew cask for v${{ inputs.version }}
    needs: app
    if: needs.app.outputs.app == 'true' && needs.app.outputs.signed == 'true' && inputs.attach && inputs.app_ref == ''
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Write walnut.rb from the attached DMGs, install it with brew, and attach it
        run: |
          gh release download "v$VERSION" --dir "$RUNNER_TEMP/attached" --clobber \
            --pattern Walnut-arm64.dmg --pattern Walnut-x64.dmg
          arm="$(shasum -a 256 "$RUNNER_TEMP/attached/Walnut-arm64.dmg" | cut -d' ' -f1)"
          intel="$(shasum -a 256 "$RUNNER_TEMP/attached/Walnut-x64.dmg" | cut -d' ' -f1)"
          node harness/scripts/homebrew/cask.mjs --version "$VERSION" --sha256-arm64 "$arm" --sha256-x64 "$intel" > "$RUNNER_TEMP/walnut.rb"
          cat "$RUNNER_TEMP/walnut.rb"
          brew tap-new --no-git walnut-release/cask
          mkdir -p "$(brew --repository walnut-release/cask)/Casks"
          cp "$RUNNER_TEMP/walnut.rb" "$(brew --repository walnut-release/cask)/Casks/walnut.rb"
          mkdir -p "$RUNNER_TEMP/brew-apps"
          brew install --cask walnut-release/cask/walnut --appdir "$RUNNER_TEMP/brew-apps"
          # Homebrew quarantines what it installs, as a browser does: Gatekeeper must take it.
          spctl -a -vv "$RUNNER_TEMP/brew-apps/Walnut.app" 2>&1 | tee "$RUNNER_TEMP/cask-assess.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/cask-assess.txt" || { echo "::error::the cask's Walnut.app is not a notarized Developer ID app"; exit 1; }
          # This runner is Apple silicon: brew took the arm64 DMG, which carries the arm64 build.
          ls "$RUNNER_TEMP/brew-apps/Walnut.app/Contents/Resources/release/v$VERSION/open-walnut-$VERSION-darwin-arm64.tar.gz"
          brew uninstall --cask walnut-release/cask/walnut
          gh release upload "v$VERSION" "$RUNNER_TEMP/walnut.rb" --clobber
