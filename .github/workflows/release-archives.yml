name: Release archives

# What a stable release gets once npm and its GitHub Release hold the compiled
# files (release.yml jobs `promote` and `stable` dispatch this):
#
#   homebrew  the formula over the release's files (scripts/homebrew/formula.mjs),
#             installed from GitHub with brew, tested, attached as open-walnut.rb
#   mac-app   Walnut.app carrying the release's darwin file (mac-app.yml)
#   archives  the old self-contained Node archives (jobs support, build, publish)
#
# By hand: rebuild any released version's formula, app or archives (each upload
# replaces what it built before).
#
# REMOVE the archive jobs (support, build, publish) two stable releases after the
# first one that ships the compiled files (docs/reference/releasing.md, "Node
# archives"). Until then they are the fallback the old installs reach for: an
# archive from before keeps updating itself with the npm inside it, and gets the
# launcher package and this platform's file; install.sh installs an archive only
# for a version that has no file. Each archive is built from the version npm
# serves, so it holds exactly what an npm install of that version holds (Node,
# the launcher, the file), and it must install with install.sh and serve a
# session with no Node on PATH before it is attached. Its lines join the
# release's SHA256SUMS, after the files' own.
#
# A version whose updater predates the archive (0.6.2 and older) gets none: its
# updater would update an archive with whatever npm is on PATH, into that npm's
# prefix. Job `support` says so and the run stays green.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'A released stable version (x.y.z), already on npm and on GitHub Releases'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-archives-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  files:
    name: v${{ inputs.version }} has the compiled files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_files: ${{ steps.check.outputs.has_files }}
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # From what the release holds, read so that GitHub failing to answer fails
      # the job: taken for "no files", an outage would write the formula from the
      # archives and leave the release without its Mac app.
      - name: Its SHA256SUMS lists them
        id: check
        run: |
          case "$VERSION" in
            *[!0-9.]* | '' ) echo "::error::$VERSION is not a stable version (x.y.z)"; exit 1 ;;
          esac
          assets="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
          held=false
          listed=false
          if printf '%s\n' "$assets" | grep -qxF "walnut-$VERSION-darwin-arm64.gz"; then held=true; fi
          if printf '%s\n' "$assets" | grep -qx SHA256SUMS; then
            gh release download "v$VERSION" --pattern SHA256SUMS --dir "$RUNNER_TEMP" --clobber
            if grep -q " walnut-$VERSION-darwin-arm64\.gz\$" "$RUNNER_TEMP/SHA256SUMS"; then listed=true; fi
          fi
          if [ "$held" = true ] && [ "$listed" = true ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          elif [ "$held" = false ] && [ "$listed" = false ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION predates the compiled file: a formula from its archives, and no Mac app"
          else
            echo "::error::v$VERSION holds walnut-$VERSION-darwin-arm64.gz: $held, its SHA256SUMS lists it: $listed. Re-attach the files (scripts/release-attach.sh) before the formula and the app are built from them."
            exit 1
          fi

  # REMOVE with the archives (see the top of this file).
  support:
    name: open-walnut ${{ inputs.version }} can have archives
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      supported: ${{ steps.check.outputs.supported }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: A stable version npm serves
        run: |
          case "$VERSION" in
            *[!0-9.]* | '' ) echo "::error::$VERSION is not a stable version (x.y.z)"; exit 1 ;;
          esac
          # npm validates a new version for a few minutes before it serves it.
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 30 -H 'cache-control: no-cache' "https://registry.npmjs.org/open-walnut/$VERSION"; then
              echo "npm serves open-walnut@$VERSION"; exit 0
            fi
            sleep 30
          done
          echo "::error::npm did not serve open-walnut@$VERSION within 30 minutes"; exit 1
      # The Node archive's builder stays on Node: an archive is a published version
      # installed with npm on that version's own Node (REMOVE with the archives).
      - name: Its updater knows the archive
        id: check
        run: |
          node scripts/runtime-bundle/build.mjs --check --spec "open-walnut@$VERSION" | tee -a "$GITHUB_OUTPUT"
          if grep -q '^supported=false' "$GITHUB_OUTPUT"; then
            echo "::notice::open-walnut@$VERSION predates the self-contained archive; no archives for it"
            echo "open-walnut@$VERSION predates the self-contained archive: no archives, formula or app for it." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: open-walnut ${{ inputs.version }} (${{ matrix.target }})
    needs: support
    if: needs.support.outputs.supported == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-26 }
          - { target: darwin-x64, os: macos-26-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # main: the build script, install.sh and the mock `claude` the smoke runs.
      - uses: actions/checkout@v5
      # Node for the archive's builder (see job support); bun for the smoke.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build the archive
        run: node scripts/runtime-bundle/build.mjs --spec "open-walnut@$VERSION" --out "$RUNNER_TEMP/out"
      - name: It is this platform's
        run: test -f "$RUNNER_TEMP/out/open-walnut-$VERSION-${{ matrix.target }}.tar.gz"
      - name: It installs with install.sh, serves and answers a session with no Node on PATH
        run: bun scripts/release-rehearsal/run.mjs --archive "$RUNNER_TEMP/out/open-walnut-$VERSION-${{ matrix.target }}.tar.gz" --work "$RUNNER_TEMP/rehearsal" --keep
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ runner.temp }}/out/open-walnut-${{ inputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          # Already gzip.
          compression-level: 0
          retention-days: 7
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/rehearsal/*/log.txt
          if-no-files-found: ignore

  # The platforms that built go up even when another failed; the run is still red
  # so the failure is seen, and "Re-run failed jobs" builds the missing one and
  # uploads the set again. REMOVE with the archives (see the top of this file).
  publish:
    name: Attach to v${{ inputs.version }}
    needs: [support, build]
    if: ${{ !cancelled() && needs.support.outputs.supported == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: ${{ runner.temp }}/archives
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # SHA256SUMS keeps every line the release lists (its compiled files), with
      # these archives' lines in place of any older ones; the script fails rather
      # than drop one, and it runs before anything goes up, so a failure uploads
      # nothing. The archives go up before the SHA256SUMS that lists them.
      # install.sh goes up only on a release that has none: release.yml attached
      # the released commit's own.
      - name: Upload the archives, then SHA256SUMS
        env:
          LEAK_SCAN_RULES: ${{ secrets.LEAK_SCAN_RULES }}
        run: |
          cd "$RUNNER_TEMP/archives"
          ls open-walnut-"$VERSION"-*.tar.gz > /dev/null 2>&1 || { echo "::error::no archive built"; exit 1; }
          sh "$GITHUB_WORKSPACE/scripts/release-archive-sums.sh" "v$VERSION" "$VERSION" . "$RUNNER_TEMP/SHA256SUMS"
          cat "$RUNNER_TEMP/SHA256SUMS"
          # The release gate (scripts/release-leak-gate.sh): nothing goes up while it finds a hit.
          sh "$GITHUB_WORKSPACE/scripts/release-leak-gate.sh" . "$RUNNER_TEMP/SHA256SUMS" "$GITHUB_WORKSPACE/scripts/install.sh"
          gh release upload "v$VERSION" open-walnut-"$VERSION"-*.tar.gz --clobber
          gh release upload "v$VERSION" "$RUNNER_TEMP/SHA256SUMS" --clobber
          assets="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "$assets" | grep -qx install.sh; then
            cp "$GITHUB_WORKSPACE/scripts/install.sh" install.sh
            gh release upload "v$VERSION" install.sh --clobber
          fi
      - name: Every platform built
        if: needs.build.result != 'success'
        run: |
          echo "::error::some platforms did not build (${{ needs.build.result }}); the others are attached. Re-run failed jobs to finish the set."
          exit 1

  # The formula is written from what the release really holds (its files; the
  # archives of a release from before them), installed from GitHub with brew,
  # tested, and attached as open-walnut.rb. The tap (EvanZhang008/homebrew-tap)
  # copies the newest release's open-walnut.rb. After the archives, so it reads
  # the SHA256SUMS they leave, but a release with files needs none of them.
  homebrew:
    name: Homebrew formula for v${{ inputs.version }}
    needs: [files, publish]
    if: ${{ !cancelled() && (needs.files.outputs.has_files == 'true' || needs.publish.result == 'success') }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Write the formula from the release's SHA256SUMS
        run: |
          gh release download "v$VERSION" --pattern SHA256SUMS --dir "$RUNNER_TEMP" --clobber
          bun scripts/homebrew/formula.mjs --version "$VERSION" --sums "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/open-walnut.rb"
          cat "$RUNNER_TEMP/open-walnut.rb"
      - name: It installs from GitHub with brew and passes brew test
        run: |
          brew tap-new --no-git walnut-release/test
          mkdir -p "$(brew --repository walnut-release/test)/Formula"
          cp "$RUNNER_TEMP/open-walnut.rb" "$(brew --repository walnut-release/test)/Formula/open-walnut.rb"
          brew install walnut-release/test/open-walnut
          # Both names the npm package gives it: a formula once linked only `walnut`.
          for name in walnut open-walnut; do
            "$(brew --prefix)/bin/$name" --version | tee "$RUNNER_TEMP/version.txt"
            grep -q "^$VERSION " "$RUNNER_TEMP/version.txt" || { echo "::error::Homebrew's $name is not $VERSION"; exit 1; }
          done
          brew test walnut-release/test/open-walnut
      - name: Attach it to the release
        env:
          LEAK_SCAN_RULES: ${{ secrets.LEAK_SCAN_RULES }}
        run: |
          sh scripts/release-leak-gate.sh "$RUNNER_TEMP/open-walnut.rb"
          gh release upload "v$VERSION" "$RUNNER_TEMP/open-walnut.rb" --clobber

  # Walnut.app, signed and notarized, carrying the release's darwin file
  # (mac-app.yml; its signing secrets live in the `release` environment). After
  # publish, whatever its result: publish replaces SHA256SUMS, which the app reads.
  mac-app:
    name: Mac app for v${{ inputs.version }}
    needs: [files, publish]
    if: ${{ !cancelled() && needs.files.outputs.has_files == 'true' }}
    uses: ./.github/workflows/mac-app.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
