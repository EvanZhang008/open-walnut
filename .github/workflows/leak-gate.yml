name: Leak gate

# The leak scan of the git history itself (scripts/leak-scan/scan-git.mjs, the same scan the
# commit and push hooks and every land run), here so that nothing reaches this repository
# unscanned: a push that skipped the local hooks, a commit made on GitHub, a bot's commit, a
# pull request. Every push and pull request scans the commits it adds; each also scans the whole
# history (a rule added later judges what is already public; known hits, all fixed forward, sit
# in the baselines). The schedule catches pushes made with GITHUB_TOKEN (the release and star
# history bots), whose events start no workflow. The scanner that judges is the BASE commit's
# (what main already had), never the pushed one, so a push cannot loosen its own scan. The
# private rules (the LEAK_SCAN_RULES secret) are required, and given only to runs of main (a push
# to it, the schedule, by hand): another branch's workflow file is its pusher's to edit, so it
# runs the committed shapes and gitleaks, as a fork's pull request does. Output is redacted: the
# rule and the file and line, never the text.
#
# A push of main needs this scan to have passed on its commit first (the "main leak gate" ruleset
# requires "Scan new commits"; lands push straight to main, so the check cannot come after). The
# pre-push hook (scripts/leak-scan/check-on-github.sh) puts the commit on a hidden
# refs/leak-check/<sha> ref and dispatches this workflow on main with `commit`: main's own copy of
# this file then scans it and writes the "Scan new commits" status on that commit.

on:
  push:
  pull_request:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: 'A commit to check before it is pushed to main (its new commits; writes the "Scan new commits" status)'
        required: false
        default: ''

permissions:
  contents: read
  statuses: write

concurrency:
  group: leak-gate-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [new commits, full history]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install gitleaks (pinned, checksum checked)
        run: |
          set -euo pipefail
          v=8.30.0
          sum=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "$sum  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: What to scan
        id: what
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ -n "$COMMIT" ]; then
            [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full sha: $COMMIT"; exit 1; }
            git cat-file -e "$COMMIT^{commit}" 2>/dev/null || git fetch -q origin "$COMMIT"
          fi
          head=${COMMIT:-${PR_HEAD:-$GITHUB_SHA}}
          base=
          if [ "$EVENT" = pull_request ]; then base=$(git merge-base "$PR_BASE" "$head")
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE
          elif [ "$EVENT" = push ] || [ -n "$COMMIT" ]; then
            # a new branch or tag, or a commit to check before main gets it: from the parent of
            # its oldest commit no branch holds
            first=$(git rev-list --reverse --topo-order "$head" --not $(git for-each-ref --format='%(objectname)' refs/remotes/origin | grep -vx "$head" || true) | head -1)
            if [ -z "$first" ]; then base=$head; elif git rev-parse -q --verify "$first^" >/dev/null; then base=$(git rev-parse "$first^"); else base=$zero; fi
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "scan: ${base:-(no new commits: $EVENT)}..$head"
      - name: The scanner that judges (the base commit's)
        env:
          BASE: ${{ steps.what.outputs.base }}
        run: |
          set -euo pipefail
          judge="$RUNNER_TEMP/judge"; mkdir -p "$judge"
          from=HEAD
          if [ -n "$BASE" ] && git cat-file -e "$BASE:scripts/leak-scan/scan-git.mjs" 2>/dev/null; then from=$BASE; fi
          git archive "$from" scripts/leak-scan | tar -x -C "$judge"
          echo "judged by the scanner of $(git rev-parse --short "$from")"
      - name: Scan
        id: scan
        env:
          LEAK_SCAN_RULES: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && secrets.LEAK_SCAN_RULES || '' }}
          PART: ${{ matrix.part }}
          COMMIT: ${{ inputs.commit }}
          BASE: ${{ steps.what.outputs.base }}
          HEAD_SHA: ${{ steps.what.outputs.head }}
          UPSTREAM: ${{ github.repository == 'EvanZhang008/open-walnut' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          rules=()
          if [ -n "$LEAK_SCAN_RULES" ]; then rules=(--rules-env LEAK_SCAN_RULES); export WALNUT_LEAK_STRICT=1
          elif [ "$UPSTREAM" = true ]; then echo "::error::The LEAK_SCAN_RULES secret is not set (scripts/leak-scan/README.md)"; exit 1
          fi
          if [ "$PART" = "full history" ] && [ -n "$COMMIT" ]; then
            echo "A commit checked before its push: its new commits are the check (the full history runs on the push of main)."
          elif [ "$PART" = "full history" ]; then
            bun "$RUNNER_TEMP/judge/scripts/leak-scan/scan-git.mjs" --repo . --history "$HEAD_SHA" --redact "${rules[@]}"
          elif [ -z "$BASE" ] || [ "$BASE" = "$HEAD_SHA" ]; then
            echo "No new commits to scan."
          else
            bun "$RUNNER_TEMP/judge/scripts/leak-scan/scan-git.mjs" --repo . --range "$BASE..$HEAD_SHA" --redact "${rules[@]}"
          fi
      - name: Report the check on the commit
        if: always() && inputs.commit != '' && matrix.part == 'new commits' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          OUTCOME: ${{ steps.scan.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = success ]; then state=success; desc='the leak scan passed'; else state=failure; desc="the leak scan did not pass ($OUTCOME)"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$COMMIT" -f state="$state" -f context='Scan new commits' -f description="$desc" -f target_url="$RUN_URL" >/dev/null
          echo "Scan new commits: $state on $COMMIT"
