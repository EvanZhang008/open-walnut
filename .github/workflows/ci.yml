name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run obsolete. Cancelling keeps
# the queue short and feedback fast (and costs nothing — this repo is public, so
# GitHub-hosted runners are free with unlimited minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned (ubuntu-24.04, macos-26), here and in release.yml and
# flake-hunt.yml: a `-latest` label moves to a new OS on GitHub's date (ubuntu
# to 26.04 from 2026-10-19), which would turn CI red without a commit. Moving to
# a new image is a deliberate one-line change, tried on a pull request first.
env:
  # tests/setup/worker-budget.ts defaults CI jobs to 4 workers. Resource-heavy
  # tiers override that per command where parallelism causes timeout flakes.
  CI: 'true'

jobs:
  # ── Gate 1: type-check + build. Everything else is moot if this fails. ───────
  build:
    name: Lint & build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Bun installs the dependencies (bun.lock, at the version package.json pins
      # as packageManager), type-checks and builds. No Node: the image's own goes
      # first (scripts/ci-remove-node.sh), so a step that still needs one fails.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bash scripts/ci-remove-node.sh
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  # The parts of the pipeline that need Node, all blocking (CI OK needs this
  # job). The Playwright runner: it loads every spec before it runs one, so a
  # single bad import fails the whole browser suite with 0 tests; listing is
  # that load step alone (~20s, no browser, no server). The plugin packages,
  # checked the way an outside plugin author uses them: packed and installed
  # with npm, scaffolded, built and tested on Node (scripts/check-plugin-packages.mjs).
  # The npm channel: a user's `npm install -g open-walnut` and npm's own file
  # lists, which the Node-free jobs skip. And the daemon's JS twin on Node, as a
  # host without the compiled daemon runs it (the Node-free jobs run it on bun).
  # The vitest runs stay on bun; WALNUT_REQUIRE_NPM / WALNUT_REQUIRE_NODE in the
  # scripts make a missing npm or Node fail instead of skip.
  node-side:
    name: Node side (browser specs load, plugin packages, npm channel, JS daemon on Node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: browser specs load
        run: bun x playwright test --list --project=chromium > /dev/null
      - run: bun run test:plugin-packages
      - run: bun run test:npm-channel
      - run: bun run test:source-twin-node

  # ── Gate 2: the test tiers that are genuinely green, so they can BLOCK ──────
  #
  # Deliberately a separate job from the informational `browser` job rather than one matrix
  # with `continue-on-error: ${{ matrix.blocking == false }}`. Job-level
  # continue-on-error has murky interaction with `needs.<job>.result` — a failed
  # but tolerated leg may still surface as 'success' — and the one check that
  # branch protection depends on must not rest on ambiguous semantics. Two jobs,
  # zero expressions, obvious behaviour.
  test:
    name: Test (${{ matrix.tier }})
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gated through the BASELINE check, not raw pass/fail: main carries
          # one known failure, so test:baseline fails only on failures absent
          # from tests/setup/known-failures.json — i.e. real regressions.
          #
          # Several nominally-fast files initialize servers and a CPU embedder.
          # Four workers oversubscribe the 4-core runner and have produced
          # different unrelated timeout failures across successive runs, so
          # each leg stays serial for deterministic signal. Serial, the whole
          # tier took 25 minutes and was the longest blocking job, so it runs
          # in three legs; each must report every file of its slice.
          - tier: quick 1/3
            cmd: bun run test:baseline -- --maxWorkers=1 --shard=1/3
          - tier: quick 2/3
            cmd: bun run test:baseline -- --maxWorkers=1 --shard=2/3
          - tier: quick 3/3
            cmd: bun run test:baseline -- --maxWorkers=1 --shard=3/3
          # 533 tests, ~10s, baseline ZERO. Plain pass/fail is correct here.
          - tier: frontend
            cmd: bun run test:frontend:ci
    steps:
      - uses: actions/checkout@v5
      # The tiers run on bun (`bun --bun vitest`), with no Node on the runner.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bash scripts/ci-remove-node.sh
      - run: bun install --frozen-lockfile
      # Workspace packages are consumed from their dist/ (demo-plugin-lifecycle loads
      # @open-walnut/plugin-api/dist/react.js); a fresh clone has not built them.
      - run: bun run build:plugins
      - name: ${{ matrix.tier }} tests
        run: ${{ matrix.cmd }}

  # ── Gate 3: the heavy tier that is genuinely green ──────────────────────────
  # 990 tests with real daemons, servers, git and embedders, zero failures since
  # 2026-10. A test that fails three times in a row is a real failure; one that
  # needs the retry is a flake to fix, and the log says so.
  test-heavy:
    name: Test (slow)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bash scripts/ci-remove-node.sh
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: slow tests
        env:
          WALNUT_DAEMON_DIR: ${{ runner.temp }}/open-walnut-slow
          GIT_AUTHOR_NAME: Open Walnut CI
          GIT_AUTHOR_EMAIL: open-walnut@localhost
          GIT_COMMITTER_NAME: Open Walnut CI
          GIT_COMMITTER_EMAIL: open-walnut@localhost
        run: bun run test:slow -- --maxWorkers=1 --retry=2

  # ── Gate 4: the e2e tier ────────────────────────────────────────────────────
  # 134 files that start real servers, daemons, git and mock CLIs, judged against
  # the committed e2e baseline (tests/setup/known-failures-e2e.json): a failure
  # absent from it fails the job, and so does a run that crashed or ran too few
  # files (no report = no verdict). Four shards: one serial run took 45 minutes.
  # Each leg uploads its own failures so a new baseline can be read off a run.
  test-e2e:
    name: Test (e2e ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bash scripts/ci-remove-node.sh
      - run: bun install --frozen-lockfile
      # The tier spawns the session daemon, which the build produces.
      - run: bun run build
      - name: e2e tests
        env:
          WALNUT_BASELINE_CONFIG: vitest.e2e.config.ts
          WALNUT_BASELINE_FILE: tests/setup/known-failures-e2e.json
          # The whole tier (133 files on 2026-10-02), not this leg's share.
          WALNUT_BASELINE_MIN_FILES: '120'
          WALNUT_BASELINE_RUN_OUT: ${{ runner.temp }}/known-failures-e2e-${{ matrix.shard }}.json
          # Never let a test process resolve the production daemon default.
          WALNUT_DAEMON_DIR: ${{ runner.temp }}/open-walnut-e2e
          # Tests create temporary repositories and commits. GitHub runners do
          # not provide an author identity by default.
          GIT_AUTHOR_NAME: Open Walnut CI
          GIT_AUTHOR_EMAIL: open-walnut@localhost
          GIT_COMMITTER_NAME: Open Walnut CI
          GIT_COMMITTER_EMAIL: open-walnut@localhost
        run: bun scripts/test-baseline.mjs check --maxWorkers=1 --retry=2 --shard=${{ matrix.shard }}/4
      - name: Upload this leg's failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-failures-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/known-failures-e2e-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # ── Does a NEW USER's machine work? ─────────────────────────────────────────
  # Every other job here installs Bun on purpose, which is exactly why a real
  # onboarding break hid from CI for weeks: `npm start` called build-daemon.sh,
  # which exited 1 when Bun was absent, so the very first command in the README
  # failed on every machine that had never installed Bun. This job is deliberately
  # BARE: no caches, nothing the docs don't tell a person to install. A checkout
  # installs with Bun, which the README asks for, so the clone route has Node and
  # Bun; Bun is removed again before the published package, which needs neither
  # Bun nor a build. It runs the documented commands and requires the server to answer.
  #
  # macOS matters on its own: it is real Mac hardware, free for public
  # repos, and the only platform where the install can hit Xcode/native-module
  # problems. Locally the same probe runs against a stock macOS VM or an EC2 box
  # (scripts/onboarding-test/), which goes further: those machines have no Node
  # and no git either.
  onboarding:
    name: Fresh machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The Bun the README asks a checkout to install (the version package.json pins).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The README's install command, as it gives it.
      - run: bun install
      - name: npm start, then require the server to answer
        run: |
          npm start > /tmp/walnut-start.log 2>&1 &
          start_pid=$!
          for i in $(seq 1 600); do
            if curl -fsS --max-time 2 http://127.0.0.1:3456/api/system/health > /tmp/health.json 2>/dev/null; then
              echo "server answered after ${i}s"; cat /tmp/health.json; echo
              curl -o /dev/null -sS -w 'GET / -> %{http_code}\n' http://127.0.0.1:3456/
              # npm's grandchild holds the port, so stop the listener itself; this VM is
              # ours alone, and never a pid <= 1.
              for p in $(lsof -tiTCP:3456 -sTCP:LISTEN 2>/dev/null) "$start_pid"; do
                [ "$p" -gt 1 ] 2>/dev/null && kill -TERM "$p" 2>/dev/null || true
              done
              exit 0
            fi
            if ! kill -0 "$start_pid" 2>/dev/null; then
              echo "::error::npm start exited before serving"; tail -n 40 /tmp/walnut-start.log; exit 1
            fi
            sleep 1
          done
          echo "::error::server never answered within 600s"; tail -n 40 /tmp/walnut-start.log
          [ "$start_pid" -gt 1 ] && kill -TERM "$start_pid" 2>/dev/null || true
          exit 1
      - name: Remove Bun (the published package needs none)
        # setup-bun put it on PATH for the clone route; the runner images ship none.
        # The point is a machine without Bun, not a runner without Bun.
        run: |
          for _ in 1 2 3 4 5; do
            b="$(command -v bun 2>/dev/null)" || break
            echo "removing bun at $b for the published route"; sudo rm -f "$b"; hash -r
          done
          for b in "$HOME/.bun/bin/bun" /usr/local/bin/bun /opt/homebrew/bin/bun; do
            if [ -e "$b" ]; then sudo rm -f "$b"; fi
          done
          hash -r
          if command -v bun >/dev/null 2>&1; then
            echo "::error::bun is still on PATH ($(command -v bun)), so the published route no longer tests a machine without Bun"
            exit 1
          fi
          echo "no bun, as intended"
      # The README's other route: the published package, no clone, no build, no Bun.
      # A fresh HOME so it starts the way a new user's first launch does, not on the
      # data the clone route just created.
      - name: npm install -g open-walnut, then require the published package to answer
        run: |
          # Again while npm names a dependency it does not serve yet (a publish in flight).
          node scripts/npm-registry-lag.mjs npm install -g open-walnut
          command -v open-walnut
          mkdir -p /tmp/walnut-npm-home
          HOME=/tmp/walnut-npm-home open-walnut web --port 3457 > /tmp/walnut-npm-start.log 2>&1 &
          start_pid=$!
          for i in $(seq 1 300); do
            if curl -fsS --max-time 2 http://127.0.0.1:3457/api/system/health > /tmp/npm-health.json 2>/dev/null; then
              echo "published package answered after ${i}s"; cat /tmp/npm-health.json; echo
              curl -o /dev/null -sS -w 'GET / -> %{http_code}\n' http://127.0.0.1:3457/
              for p in $(lsof -tiTCP:3457 -sTCP:LISTEN 2>/dev/null) "$start_pid"; do
                [ "$p" -gt 1 ] 2>/dev/null && kill -TERM "$p" 2>/dev/null || true
              done
              exit 0
            fi
            if ! kill -0 "$start_pid" 2>/dev/null; then
              echo "::error::open-walnut web exited before serving"; tail -n 40 /tmp/walnut-npm-start.log; exit 1
            fi
            sleep 1
          done
          echo "::error::the published package never answered within 300s"; tail -n 40 /tmp/walnut-npm-start.log
          [ "$start_pid" -gt 1 ] && kill -TERM "$start_pid" 2>/dev/null || true
          exit 1
      # This runner has no `claude` and no credentials, which is the one first-run
      # state a developer's own machine can never reproduce (a Mac with Claude Code
      # in /opt/homebrew/bin is always "ready"). Both routes must report it honestly:
      # that pair of falses is what makes the SPA show the install card instead of
      # "Walnut runs on your Claude Code".
      - name: A machine without Claude Code must say so
        run: |
          for f in /tmp/health.json /tmp/npm-health.json; do
            jq -e '.claudeCliAvailable == false and .hasReadyProvider == false' "$f" > /dev/null \
              || { echo "::error::$f claims Claude Code or a provider is ready on a bare runner"; cat "$f"; exit 1; }
          done
          echo "both routes report: no Claude Code, no provider (install card state)"
      - name: Upload start logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-start-log-${{ matrix.os }}
          path: |
            /tmp/walnut-start.log
            /tmp/walnut-npm-start.log
          if-no-files-found: ignore

  # ── Does the SECOND machine work? ───────────────────────────────────────────
  # `onboarding` proves the server installs. This proves Walnut can provision a
  # brand-new Linux dev box over real ssh: the box is a container
  # (scripts/onboarding-test/remote-host/Dockerfile) with no C compiler, no node,
  # an npm-built `claude` and ~/workplace symlinked to /workplace. The live test
  # runs the real DaemonConnection against it: Bun is installed ON THE BOX by
  # Walnut's own install-runtime step, then the folder picker, the terminal
  # probe, host.preflight and a session start are checked. Bun is installed on
  # the runner only to build the daemon sidecars (the Walnut side).
  remote-host:
    name: Remote host (fresh Linux dev box)
    runs-on: ubuntu-24.04
    needs: build
    # Setup (~4 min) plus two capped attempts (2 x 12 min) fits in 30.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The Walnut side runs on bun alone (the live test through `bun --bun vitest`).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bash scripts/ci-remove-node.sh
      - run: bun install --frozen-lockfile
      - run: bun run build:daemon
        env:
          WALNUT_REQUIRE_BUN: '1'
      # One retry: this job pulls the base image from Docker Hub and the remote
      # host downloads Bun from bun.sh, so a network blip must not fail an
      # unrelated PR. Each attempt is capped at 12 minutes (step f alone may wait 6
      # for the native Claude Code install) so a hang cannot use the budget twice, both attempts' logs are uploaded (a pass on the
      # retry still shows why attempt 1 failed), and any line starting with
      # NETWORK: (the test's label for a download failure) goes to the summary.
      - name: Provision a clean-room remote host and onboard it (one retry)
        shell: bash
        timeout-minutes: 26
        env:
          # Runs the opt-in step f: reconnect with autofix on (host.fix).
          WALNUT_REMOTE_ONBOARDING_AUTOFIX: '1'
        run: |
          # GitHub runs this as `bash -eo pipefail`; -e would end the loop at attempt 1.
          set +e
          set -uo pipefail
          mkdir -p /tmp/remote-host-logs
          status=1
          for attempt in 1 2; do
            log="/tmp/remote-host-logs/attempt-$attempt.log"
            echo "::group::remote-host attempt $attempt"
            timeout --kill-after=30s 12m bash scripts/onboarding-test/remote-host/run.sh 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$status" = 0 ] && break
            [ "$status" = 124 ] && echo "::warning title=remote-host::attempt $attempt hit its 12 minute cap"
            echo "::warning title=remote-host::attempt $attempt failed with exit $status"
          done
          if grep -h 'NETWORK:' /tmp/remote-host-logs/attempt-*.log > /tmp/remote-host-logs/network.txt; then
            { echo "### remote-host: network failures"; echo '```'; cat /tmp/remote-host-logs/network.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" = 0 ] && [ -f /tmp/remote-host-logs/attempt-2.log ]; then
            echo "::warning title=remote-host::passed on the retry; attempt 1's log is in the remote-host-logs artifact"
          fi
          exit "$status"
      - name: Upload remote-host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-host-logs
          path: /tmp/remote-host-logs/
          if-no-files-found: ignore

  # ── Rehearse the release on every push ──────────────────────────────────────
  # The package this commit would publish, installed the way a user installs it
  # (npm 12, the updater's --allow-scripts list, a HOME nothing ran in), must
  # serve, run a session against a mock `claude` across a server restart, and
  # update itself from an older build of the same code, started against a local
  # registry whose `latest` is this package. Nothing is published
  # (scripts/release-rehearsal/). The self-contained archive install.sh and
  # Homebrew install is built from the same package, installed by install.sh,
  # served with no Node on PATH, installed through its Homebrew formula, and
  # updated through its own npm. The update from the versions on npm today is
  # job `field`. The nightly and the daily stable only ship commits whose CI OK
  # includes both.
  rehearsal:
    name: Release rehearsal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build as prepublishOnly does
        run: WALNUT_REQUIRE_BUN=1 bun run build && (cd web && bun x vite build) && bun scripts/check-publish.mjs
      - name: Pack this commit as the next patch, and an older build of it
        run: bun scripts/release-rehearsal/pack.mjs --out "$RUNNER_TEMP/packs" --rehearsal
      # The Mac app (desktop/): its tests, and the app the rehearsal's archive-app launches.
      - name: Build the Mac app
        if: startsWith(matrix.os, 'macos')
        run: bash scripts/test-desktop.sh && bash desktop/build.sh
      # What the user runs; the updater inside the installed package calls it too.
      - run: npm install -g npm@12
      - name: Install, serve, talk, restart and update, as a user's machine would
        env:
          # Homebrew comes with both images; on Ubuntu it is off PATH.
          WALNUT_REHEARSAL_BREW: ${{ startsWith(matrix.os, 'macos') && 'brew' || '/home/linuxbrew/.linuxbrew/bin/brew' }}
          WALNUT_REHEARSAL_APP: ${{ startsWith(matrix.os, 'macos') && format('{0}/desktop/Walnut.app', github.workspace) || '' }}
        run: bun scripts/release-rehearsal/run.mjs --packs "$RUNNER_TEMP/packs/packs.json" --runtime --work "$RUNNER_TEMP/rehearsal" --keep
      - name: Upload rehearsal logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rehearsal/*/log.txt
            ${{ runner.temp }}/rehearsal/*.log
          if-no-files-found: ignore

  # ── Rehearse the update every existing install takes ────────────────────────
  # The releases on npm today (its `latest` and `nightly`, and the newest one
  # still in the Node form), each installed from the real registry the way a
  # person installed it, take this commit published as a release publishes it
  # now: the open-walnut launcher and this runner's @open-walnut/<target> file
  # (scripts/release-rehearsal/field-packs.mjs), at a version above every one
  # of them, so a version skew never skips it. Fresh and in use (a task, a live
  # session and its history; the server restarts into the update with its
  # daemon still running), by the old release's own startup update and `walnut
  # update`, by `npm install -g` typed by hand, and with the file not yet on
  # the registry (with and without install scripts); and a stable release's
  # self-contained archive, installed by its own install.sh, updating through
  # its own npm into its prefix. Then the release's own updater takes the
  # version after it (scripts/release-rehearsal/field.mjs).
  field:
    name: Release rehearsal, field update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Compile this commit for this runner at two versions above npm's, and pack them as a release does
        run: node scripts/release-rehearsal/field-packs.mjs build --out "$RUNNER_TEMP/field"
      # What the user runs; the updater inside the installed package calls it too.
      - run: npm install -g npm@12
      - name: Update the releases on npm today to it, fresh and in use, as a user's machine would
        run: node scripts/release-rehearsal/run.mjs --field latest --field-packs "$RUNNER_TEMP/field/field.json" --work "$RUNNER_TEMP/field-run" --keep
      - name: Upload field logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: field-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/field-run/*/*.txt
            ${{ runner.temp }}/field-run/*/daemon/*.log
          if-no-files-found: ignore

  # ── The archives the rehearsal does not build ───────────────────────────────
  # A release ships four self-contained archives (release-archives.yml); the
  # rehearsal above builds the macos-26 and ubuntu-24.04 ones. These legs build
  # the other two from this commit's package, each on the runner its release leg
  # uses, and run it with no Node on PATH: install.sh installs it, it serves and
  # answers a session. 2026-10-06: the first stable with archives (0.6.4) found
  # at release time that onnxruntime-node ships no macOS x64 binary.
  archive-targets:
    name: Archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-x64, os: macos-26-intel }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build as prepublishOnly does
        run: WALNUT_REQUIRE_BUN=1 bun run build && (cd web && bun x vite build) && bun scripts/check-publish.mjs
      - name: Pack this commit as the next patch
        run: bun scripts/release-rehearsal/pack.mjs --out "$RUNNER_TEMP/packs" --rehearsal
      - name: Build its archive, install it with install.sh, serve and answer a session with no Node on PATH
        run: |
          current="$(bun -p "require(process.argv[1]).current" "$RUNNER_TEMP/packs/packs.json")"
          # The Node archive's builder stays on Node, as in release-archives.yml.
          node scripts/runtime-bundle/build.mjs --spec "$current" --out "$RUNNER_TEMP/archive"
          bun scripts/release-rehearsal/run.mjs --archive "$(ls "$RUNNER_TEMP"/archive/open-walnut-*-${{ matrix.target }}.tar.gz)" --work "$RUNNER_TEMP/rehearsal" --keep
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs-${{ matrix.target }}
          path: ${{ runner.temp }}/rehearsal/*/log.txt
          if-no-files-found: ignore

  # ── Informational: the browser suite ────────────────────────────────────────
  # The Playwright specs drive the real SPA against a fixture server with a mock
  # CLI (tests/e2e/browser/). Eight shards, retries on (playwright.config.ts under
  # CI). Reported, not judged, until a recorded baseline lets new failures block.
  # The runner is the one part of the pipeline on Node; every server it starts
  # runs on bun (tests/helpers/bun-runtime.ts).
  browser:
    name: Report (browser ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # The test run's budget is counted from here, not from its own start: on
      # 2026-10-23 installing the browsers took 14 min instead of 20 s, a run
      # given its fixed 45 min was still going when the job's 60 ran out, and the
      # shard was cancelled with no report.
      - run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build && (cd web && bun x vite build)
      # WebKit too: the *.webkit.spec.ts specs launch it themselves (the Mac app
      # is WebKit), and without it each one failed at launch (98 tests, 2026-10-23).
      - run: bun x playwright install --with-deps chromium webkit
      - name: browser tests
        id: report
        continue-on-error: true
        env:
          PW_IGNORE_LOAD: '1'
          WALNUT_DAEMON_DIR: ${{ runner.temp }}/open-walnut-browser
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-${{ matrix.shard }}.json
        # Eight shards of ~280 tests fit the hour; four took 58+ min and two hit the
        # job timeout with no report. One retry still tells flaky from failing, and
        # --global-timeout ends the run itself, so the JSON report is always written:
        # 45 min at most, and never past 55 min into the job, which leaves the
        # teardown, the summary and the upload 5 min before the job timeout.
        run: |
          left=$(( JOB_STARTED_AT + 55 * 60 - $(date +%s) ))
          budget=$(( left < 2700 ? left : 2700 ))
          [ "$budget" -ge 60 ] || budget=60
          echo "test budget: ${budget}s"
          bun x playwright test --project=chromium --shard=${{ matrix.shard }}/8 --retries=1 --global-timeout=$(( budget * 1000 )) --reporter=line,json
      - name: Summarize
        if: always()
        run: |
          f="$RUNNER_TEMP/browser-${{ matrix.shard }}.json"
          [ -f "$f" ] || { echo "no report" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          bun scripts/playwright-summary.mjs "$f" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-${{ matrix.shard }}.json
          if-no-files-found: ignore

  # ── The single required check ───────────────────────────────────────────────
  #
  # Point branch protection at THIS job, never at individual matrix legs: leg
  # names change whenever the matrix does, which silently orphans a
  # required-check rule and leaves the branch unprotected.
  #
  # `needs` deliberately omits browser, so the informational tier cannot block.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    needs: [build, node-side, test, test-heavy, test-e2e, onboarding, remote-host, rehearsal, field, archive-targets]
    # Runs whatever the gates concluded, EXCEPT on a run a newer push cancelled:
    # there it judged cancelled legs and turned the superseded run red (6 of the
    # 9 red runs on main from 2026-10-02 to 10-04). A job that hits its timeout
    # does not cancel the run, so CI OK still runs and fails on it.
    if: ${{ !cancelled() }}
    steps:
      - name: Check gate results
        run: |
          echo "build:      ${{ needs.build.result }}"
          echo "node-side:  ${{ needs.node-side.result }}"
          echo "test:       ${{ needs.test.result }}"
          echo "test-heavy: ${{ needs.test-heavy.result }}"
          echo "test-e2e:   ${{ needs.test-e2e.result }}"
          echo "rehearsal:  ${{ needs.rehearsal.result }}"
          echo "field:      ${{ needs.field.result }}"
          echo "archive-targets: ${{ needs.archive-targets.result }}"
          echo "onboarding: ${{ needs.onboarding.result }}"
          echo "remote-host: ${{ needs.remote-host.result }}"
          # A matrix job's result is 'success' only when EVERY leg succeeded.
          # None of these jobs uses continue-on-error, so the values are unambiguous.
          failed=0
          [ "${{ needs.build.result }}" = "success" ] || { echo "::error::build failed"; failed=1; }
          [ "${{ needs.node-side.result }}" = "success" ] || { echo "::error::a browser spec failed to load, or a Node check failed (plugin packages, npm channel, JS daemon on Node)"; failed=1; }
          [ "${{ needs.test.result }}" = "success" ] || { echo "::error::a blocking test tier failed"; failed=1; }
          [ "${{ needs.test-heavy.result }}" = "success" ] || { echo "::error::the slow tier failed"; failed=1; }
          [ "${{ needs.test-e2e.result }}" = "success" ] || { echo "::error::the e2e tier failed: a failure not in tests/setup/known-failures-e2e.json, or a run that crashed"; failed=1; }
          [ "${{ needs.rehearsal.result }}" = "success" ] || { echo "::error::the release rehearsal failed: this commit's package does not install, serve or update"; failed=1; }
          [ "${{ needs.field.result }}" = "success" ] || { echo "::error::the field rehearsal failed: an install of a release on npm today does not update to this commit and keep its work"; failed=1; }
          [ "${{ needs.archive-targets.result }}" = "success" ] || { echo "::error::an archive a release ships (darwin-x64 or linux-arm64) did not build or run"; failed=1; }
          [ "${{ needs.onboarding.result }}" = "success" ] || { echo "::error::the documented install broke on a fresh machine"; failed=1; }
          [ "${{ needs.remote-host.result }}" = "success" ] || { echo "::error::Walnut could not onboard a fresh remote host"; failed=1; }
          [ "$failed" = "0" ] || exit 1
          echo "All blocking checks passed."
