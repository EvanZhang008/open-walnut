name: Update star history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/star-history.yml'
      - 'scripts/generate-star-history.mjs'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  # dispatches the Leak gate, whose "Scan new commits" check main's ruleset requires
  actions: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  update:
    name: Update chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Generate chart
        run: bun scripts/generate-star-history.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- docs/assets/star-history.svg)" ]; then
            echo "Star history is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history.svg
          git commit -m "docs: update star history"
          # GitHub's main takes only a commit that passed the Leak gate (scripts/leak-scan/README.md)
          printf 'refs/heads/main %s refs/heads/main %040d\n' "$(git rev-parse HEAD)" 0 | bash scripts/leak-scan/check-on-github.sh origin "$(git remote get-url origin)"
          git push
