name: Binary matrix

# The compiled Walnut file (scripts/build-binary.mjs) on every system it claims:
# old and new Linux (glibc from 2.17, musl), x64 and arm64, macOS on both chips,
# and an old kernel. Each row runs the same rehearsal (scripts/release-rehearsal/
# binary.mjs) with nothing installed but the file: no Node, no bun. The release
# publishes only a commit whose push run here passed, every row (scripts/ci-gate.mjs).
#
# A release also calls this with the files it is about to publish (release.yml,
# jobs `*-files`): `files` names its artifact (walnut-<version>-<target>.gz and
# SHA256SUMS, scripts/release-files.mjs), built at the release's version. Then
# nothing is built here: each row unpacks its own target from those very bytes,
# checked by both of its SHA256SUMS lines (scripts/release-unpack.sh), and
# rehearses it with the scripts of the commit it was built from (`ref`) and
# package.json saying `version`, the version the file reports.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      files:
        description: "An artifact of the calling run holding a release's assets: run these files instead of building"
        type: string
        default: ''
      version:
        description: 'The version those files report'
        type: string
        default: ''
      ref:
        description: 'The commit they were built from'
        type: string
        default: ''

# A release's call runs inside the release's run, on its ref (main for a nightly
# or a promote): with the push runs' group it would cancel main's push run, or
# be cancelled by the next one. So a call gets a group of its own and is never
# cancelled. A push to main gets a group of its own commit too: a release needs
# this verdict on the very commit CI passed, and CI on main runs whichever commit
# is newest when its last run ends, so every commit of main needs one (2026-10-31:
# 45 of 60 runs here were cancelled by the next push). Only a pull request's push
# supersedes the run before it.
concurrency:
  group: binary-matrix-${{ inputs.files != '' && format('{0}-{1}', github.run_id, inputs.files) || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ inputs.files == '' && github.event_name == 'pull_request' }}

env:
  # onnxruntime-node's install script fetches its CUDA provider (about 240 MB from
  # api.nuget.org) on every Linux x64 `bun install`; Walnut embeds on the CPU, as in
  # ci.yml. 2026-10-28: a nuget timeout failed a flake hunt leg before any test ran.
  ONNXRUNTIME_NODE_INSTALL: skip
  # A second download that cannot hang (2026-11-11, push run 43016273510, centos:7 row): both of
  # actions/download-artifact's tries stalled on the blob for their full 8 minutes while every other
  # row got the same artifact in under a minute, so the row failed. The retry reads the artifact
  # through the REST API with curl, which gives up on a stream slower than 1 MB/s for 30 s and asks
  # again (a fresh signed link each time), three times. Inline, not a script or a local action: a
  # release checks out `ref`, which may predate any file added here
  # (tests/scripts/binary-matrix-download.test.ts).
  FETCH_ARTIFACT: |
    set -eu
    name=$1; dir=$2
    api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
    auth="Authorization: Bearer $GH_TOKEN"
    zip="$RUNNER_TEMP/fetch-$name.zip"
    try=1
    while :; do
      id=$(curl -fsS --retry 3 --max-time 60 -H "$auth" "$api/runs/$GITHUB_RUN_ID/artifacts?name=$name&per_page=1" | jq -r '.artifacts[0].id // empty') || id=
      if [ -n "$id" ] && curl -fL --connect-timeout 20 --speed-limit 1048576 --speed-time 30 --max-time 300 -sS -H "$auth" -o "$zip" "$api/artifacts/$id/zip"; then break; fi
      echo "::warning::fetching artifact $name (try $try of 3) stalled or failed"
      [ "$try" -lt 3 ] || exit 1
      try=$((try + 1)); sleep 10
    done
    mkdir -p "$dir"
    unzip -oq "$zip" -d "$dir"
    rm -f "$zip"

# Runner images are pinned, as in ci.yml.
jobs:
  build:
    name: Build the files
    if: inputs.files == ''
    # macOS: it signs the darwin files and builds the SQLite they carry.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # bun's package store, shared by every job's install (tests/scripts/ci-bun-store.test.ts).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bun-store
          key: bun-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'web/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-store
      # Every target from one machine: bun cross-compiles.
      - run: bun scripts/build-binary.mjs --all
      - name: sizes
        run: |
          for f in dist-bin/walnut-*; do
            printf '%s %s MB, %s MB gzip\n' "$(basename "$f")" "$(( $(wc -c < "$f") / 1048576 ))" "$(( $(gzip -c "$f" | wc -c) / 1048576 ))"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: walnut-files
          path: dist-bin/walnut-*
          retention-days: 7

  # Linux images through docker on the runner: a `container:` job would need the
  # runner's own Node inside the image, which an old glibc cannot run.
  linux:
    name: ${{ matrix.image }} (${{ matrix.file }})
    needs: build
    # A release's files skip the build; a failed build runs nothing.
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.files != '')) }}
    # actions: read for the artifact fetch (FETCH_ARTIFACT).
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      FILE: ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'centos:7' }              # glibc 2.17
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'opensuse/leap:15.2' }    # glibc 2.26
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'ubuntu:18.04' }          # glibc 2.27
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'debian:10' }             # glibc 2.28
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'ubuntu:20.04' }
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'ubuntu:22.04' }
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'ubuntu:24.04' }
          - { runner: ubuntu-24.04, file: walnut-linux-x64, image: 'fedora:latest' }
          - { runner: ubuntu-24.04, file: walnut-linux-x64-musl, image: 'alpine:3.18' }
          - { runner: ubuntu-24.04, file: walnut-linux-x64-musl, image: 'alpine:latest' }
          - { runner: ubuntu-24.04-arm, file: walnut-linux-arm64, image: 'ubuntu:20.04' }
          - { runner: ubuntu-24.04-arm, file: walnut-linux-arm64, image: 'debian:12' }
          - { runner: ubuntu-24.04-arm, file: walnut-linux-arm64, image: 'ubuntu:24.04' }
          - { runner: ubuntu-24.04-arm, file: walnut-linux-arm64-musl, image: 'alpine:latest' }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        if: inputs.files == ''
        # A failed download (2026-10-31: the artifact service timed out, macos-26-intel)
        # leaves the file missing too: the check below downloads once more.
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: walnut-files
          path: dist-bin
      # A download cut short can pass with the file missing (2026-10-28, macos-26-intel):
      # download once more before failing (tests/scripts/binary-matrix-download.test.ts).
      - id: files
        if: inputs.files == ''
        run: |
          if [ -s "dist-bin/$FILE" ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "::warning::dist-bin/$FILE is missing after the download; downloading walnut-files again"; echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - if: inputs.files == '' && steps.files.outputs.missing == 'true'
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh -c "$FETCH_ARTIFACT" fetch walnut-files dist-bin
      - if: inputs.files == ''
        run: |
          [ -s "dist-bin/$FILE" ] || { echo "::error::dist-bin/$FILE is not in the walnut-files artifact after two downloads"; ls -la dist-bin || true; exit 1; }
          chmod +x dist-bin/walnut-*
      # A release's files: this row's target out of the very .gz the release
      # publishes, and package.json at the version the file reports.
      # A release's files: a download that hangs (2026-11-07, macos-26-intel: 30 minutes on
      # this step, so the job timed out and the 0.6.28 promotion was cancelled) or ends
      # without the file is cut off and downloaded once more
      # (tests/scripts/binary-matrix-download.test.ts).
      - uses: actions/download-artifact@v4
        if: inputs.files != ''
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: ${{ inputs.files }}
          path: ${{ runner.temp }}/release
      - id: release
        if: inputs.files != ''
        run: |
          gz="$RUNNER_TEMP/release/walnut-$VERSION-${FILE#walnut-}.gz"
          if [ -s "$RUNNER_TEMP/release/SHA256SUMS" ] && [ -s "$gz" ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "::warning::$gz or SHA256SUMS is missing after the download; downloading ${{ inputs.files }} again"; echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - if: inputs.files != '' && steps.release.outputs.missing == 'true'
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.files }}
        run: sh -c "$FETCH_ARTIFACT" fetch "$NAME" "$RUNNER_TEMP/release"
      - uses: oven-sh/setup-bun@v2
        if: inputs.files != ''
        with:
          bun-version: 1.4.4
      - name: This row's file from the release's assets
        if: inputs.files != ''
        run: |
          sh scripts/release-unpack.sh "$RUNNER_TEMP/release" "$VERSION" dist-bin "${FILE#walnut-}"
          bun scripts/release-files.mjs stamp "$VERSION"
      - run: sh scripts/binary-matrix.sh "dist-bin/${{ matrix.file }}" "${{ matrix.image }}"

  macos:
    name: ${{ matrix.runner }} (${{ matrix.file }})
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.files != '')) }}
    # actions: read for the artifact fetch (FETCH_ARTIFACT).
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      FILE: ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest macOS a hosted runner still has (macos-14 was retired 2026-11-02).
          - { runner: macos-15, file: walnut-darwin-arm64 }
          - { runner: macos-26, file: walnut-darwin-arm64 }
          - { runner: macos-26-intel, file: walnut-darwin-x64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        if: inputs.files == ''
        # A failed download (2026-10-31: the artifact service timed out, macos-26-intel)
        # leaves the file missing too: the check below downloads once more.
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: walnut-files
          path: dist-bin
      # A download cut short can pass with the file missing (2026-10-28, macos-26-intel):
      # download once more before failing (tests/scripts/binary-matrix-download.test.ts).
      - id: files
        if: inputs.files == ''
        run: |
          if [ -s "dist-bin/$FILE" ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "::warning::dist-bin/$FILE is missing after the download; downloading walnut-files again"; echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - if: inputs.files == '' && steps.files.outputs.missing == 'true'
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh -c "$FETCH_ARTIFACT" fetch walnut-files dist-bin
      - if: inputs.files == ''
        run: |
          [ -s "dist-bin/$FILE" ] || { echo "::error::dist-bin/$FILE is not in the walnut-files artifact after two downloads"; ls -la dist-bin || true; exit 1; }
          chmod +x dist-bin/walnut-*
      # A release's files: a download that hangs (2026-11-07, macos-26-intel: 30 minutes on
      # this step, so the job timed out and the 0.6.28 promotion was cancelled) or ends
      # without the file is cut off and downloaded once more
      # (tests/scripts/binary-matrix-download.test.ts).
      - uses: actions/download-artifact@v4
        if: inputs.files != ''
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: ${{ inputs.files }}
          path: ${{ runner.temp }}/release
      - id: release
        if: inputs.files != ''
        run: |
          gz="$RUNNER_TEMP/release/walnut-$VERSION-${FILE#walnut-}.gz"
          if [ -s "$RUNNER_TEMP/release/SHA256SUMS" ] && [ -s "$gz" ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "::warning::$gz or SHA256SUMS is missing after the download; downloading ${{ inputs.files }} again"; echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - if: inputs.files != '' && steps.release.outputs.missing == 'true'
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.files }}
        run: sh -c "$FETCH_ARTIFACT" fetch "$NAME" "$RUNNER_TEMP/release"
      - uses: oven-sh/setup-bun@v2
        if: inputs.files != ''
        with:
          bun-version: 1.4.4
      - name: This row's file from the release's assets
        if: inputs.files != ''
        run: |
          sh scripts/release-unpack.sh "$RUNNER_TEMP/release" "$VERSION" dist-bin "${FILE#walnut-}"
          bun scripts/release-files.mjs stamp "$VERSION"
      # An invalid signature may run today and be refused by a later macOS: judge it here.
      - run: codesign --verify --verbose "dist-bin/${{ matrix.file }}"
      - name: rehearse
        env:
          BUN_BE_BUN: '1'
        run: ./dist-bin/${{ matrix.file }} scripts/release-rehearsal/run.mjs --binary ./dist-bin/${{ matrix.file }} --work "$RUNNER_TEMP/rehearsal"

  # Containers share the runner's kernel, so an old kernel needs a VM: CentOS 7's
  # own 3.10 kernel, booted under QEMU (KVM when the runner exposes it).
  old-kernel:
    name: centos 7 VM (kernel 3.10)
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.files != '')) }}
    # actions: read for the artifact fetch (FETCH_ARTIFACT).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        if: inputs.files == ''
        # A failed download (2026-10-31: the artifact service timed out, macos-26-intel)
        # leaves the file missing too: the check below downloads once more.
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: walnut-files
          path: dist-bin
      # A download cut short can pass with the file missing (2026-10-28, macos-26-intel):
      # download once more before failing (tests/scripts/binary-matrix-download.test.ts).
      - id: files
        if: inputs.files == ''
        env:
          FILE: walnut-linux-x64
        run: |
          if [ -s "dist-bin/$FILE" ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "::warning::dist-bin/$FILE is missing after the download; downloading walnut-files again"; echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - if: inputs.files == '' && steps.files.outputs.missing == 'true'
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh -c "$FETCH_ARTIFACT" fetch walnut-files dist-bin
      - if: inputs.files == ''
        env:
          FILE: walnut-linux-x64
        run: |
          [ -s "dist-bin/$FILE" ] || { echo "::error::dist-bin/$FILE is not in the walnut-files artifact after two downloads"; ls -la dist-bin || true; exit 1; }
          chmod +x dist-bin/walnut-*
      # A release's files: a download that hangs (2026-11-07, macos-26-intel: 30 minutes on
      # this step, so the job timed out and the 0.6.28 promotion was cancelled) or ends
      # without the file is cut off and downloaded once more
      # (tests/scripts/binary-matrix-download.test.ts).
      - uses: actions/download-artifact@v4
        if: inputs.files != ''
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: ${{ inputs.files }}
          path: ${{ runner.temp }}/release
      - id: release
        if: inputs.files != ''
        env:
          FILE: walnut-linux-x64
        run: |
          gz="$RUNNER_TEMP/release/walnut-$VERSION-${FILE#walnut-}.gz"
          if [ -s "$RUNNER_TEMP/release/SHA256SUMS" ] && [ -s "$gz" ]; then echo "missing=false" >> "$GITHUB_OUTPUT"
          else echo "::warning::$gz or SHA256SUMS is missing after the download; downloading ${{ inputs.files }} again"; echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - if: inputs.files != '' && steps.release.outputs.missing == 'true'
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.files }}
        run: sh -c "$FETCH_ARTIFACT" fetch "$NAME" "$RUNNER_TEMP/release"
      - uses: oven-sh/setup-bun@v2
        if: inputs.files != ''
        with:
          bun-version: 1.4.4
      - name: The linux-x64 file from the release's assets
        if: inputs.files != ''
        run: |
          sh scripts/release-unpack.sh "$RUNNER_TEMP/release" "$VERSION" dist-bin linux-x64
          bun scripts/release-files.mjs stamp "$VERSION"
      - run: sh scripts/binary-old-kernel.sh dist-bin/walnut-linux-x64
