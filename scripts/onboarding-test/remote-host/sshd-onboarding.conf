# Onboarding fixture sshd settings. Included first by Ubuntu's sshd_config, and
# sshd keeps the FIRST value it reads, so these win over the stock defaults.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
AllowUsers alice
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
PrintMotd no
