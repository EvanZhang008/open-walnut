<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme Sign in</title>
<style>body{font-family:-apple-system,system-ui;margin:0;background:#f4f1ec;color:#222}main{max-width:420px;margin:60px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 6px 30px rgba(0,0,0,.08)}h1{font-size:26px;margin:0 0 6px}p{color:#666;margin:0 0 22px}label{display:block;font-size:14px;color:#555;margin:14px 0 6px}input{width:100%;box-sizing:border-box;font-size:17px;padding:13px;border:1px solid #ccc;border-radius:10px}button{margin-top:22px;width:100%;font-size:17px;padding:14px;border:0;border-radius:10px;background:#8b5a2b;color:#fff;font-weight:600}</style></head>
<body><main><h1>Acme</h1><p>Sign in to your account</p>
<form action="otp.html" method="get" autocomplete="on">
<label for="u">Email</label><input id="u" name="username" type="email" autocomplete="username" placeholder="you@example.com">
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" placeholder="Password">
<button type="submit">Sign in</button></form></main></body></html>
