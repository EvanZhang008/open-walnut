<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acme Two-step</title>
<style>body{font-family:-apple-system,system-ui;margin:0;background:#f4f1ec;color:#222}main{max-width:420px;margin:60px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 6px 30px rgba(0,0,0,.08)}h1{font-size:26px;margin:0 0 6px}p{color:#666;margin:0 0 22px}input{width:100%;box-sizing:border-box;font-size:24px;letter-spacing:6px;text-align:center;padding:13px;border:1px solid #ccc;border-radius:10px}button{margin-top:22px;width:100%;font-size:17px;padding:14px;border:0;border-radius:10px;background:#8b5a2b;color:#fff;font-weight:600}</style></head>
<body><main><h1>Two-step verification</h1><p>Enter the 6-digit code from your authenticator.</p>
<p id="who"></p><form action="done.html" method="get"><input id="c" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="8"><button type="submit">Verify</button></form></main><script>var q=new URLSearchParams(location.search);document.getElementById("who").textContent="Signed in as "+(q.get("username")||"(empty)")+(q.get("password")?" with a password":" with no password");</script></body></html>
