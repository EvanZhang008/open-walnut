appId: dev.openwalnut.ios
name: Open Passwords from a fresh launch (unlocked with Face ID when locked)
---
- launchApp:
    stopApp: true
# A fresh install asks to let this iPhone sign approvals unless the server has no signing key
# (autofill-e2e.sh clears them with WALNUT_E2E_SERVER_HOME); deny it if it still shows.
- tapOn:
    id: "approval.deny"
    optional: true
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "settings.passwords"
    direction: DOWN
- tapOn:
    id: "settings.passwords"
# Face ID starts by itself; tap the button only if the screen still waits on it.
- extendedWaitUntil:
    notVisible:
      id: "passwords.unlockBiometrics"
    timeout: 10000
    optional: true
- tapOn:
    id: "passwords.unlockBiometrics"
    optional: true
- extendedWaitUntil:
    visible:
      id: "passwords.tile.all"
    timeout: 20000
