# Lifecycle stressor: rapid tab switching + repeated open/close of heavy pages.
# Catches leaked SSE clients, store teardown races, and view identity churn.
appId: dev.openwalnut.ios
---
- launchApp
- repeat:
    times: 20
    commands:
      - tapOn: "Notes"
      - tapOn: "Tasks"
      - tapOn: "Settings"
      - tapOn: "Chat"
- extendedWaitUntil:
    visible:
        id: "chat.composer"
    timeout: 5000
# Drawer open/close loop (overlay + gesture races). Closes on the scrim, whose
# tappable area is the sliver of chat still showing beside the open drawer.
- repeat:
    times: 8
    commands:
      - tapOn:
          id: "chat.menu"
      - tapOn:
          id: "chat.drawer.scrim"
# Close it by gesture too: the interactive swipe is a different code path from the
# button, and it is the one that can leave the drawer parked half open.
- repeat:
    times: 4
    commands:
      - tapOn:
          id: "chat.menu"
      - swipe:
          start: "85%, 55%"
          end: "3%, 55%"
          duration: 250
- extendedWaitUntil:
    visible:
        id: "chat.composer"
    timeout: 5000
