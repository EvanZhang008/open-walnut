name: Walnut
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Automatic signing with the paid "Chen Zhong" team, so device archives /
    # TestFlight uploads resolve a real cert + provisioning profile.
    # Simulator builds don't require signing and ignore these.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G3PQWSGR5W
targets:
  Walnut:
    type: application
    platform: iOS
    sources:
      - Walnut
    scheme: {}
    info:
      path: Walnut/Support/Info.plist
      properties:
        CFBundleDisplayName: Walnut
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Allow plain-http Walnut servers on the local network (LAN mode);
        # cloud servers are HTTPS and unaffected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # QR pairing: the setup screen scans the wn://pair code shown by the
        # web console (Settings → Devices).
        NSCameraUsageDescription: Walnut uses the camera to scan the pairing QR code from your Walnut console.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
