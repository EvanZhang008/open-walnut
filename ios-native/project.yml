name: Walnut
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Automatic signing so device archives / TestFlight uploads resolve a real
    # cert + provisioning profile. Simulator builds don't sign and ignore these.
    # DEVELOPMENT_TEAM is left blank here (public repo) — the build/upload script
    # injects the signer's team ID from a local, gitignored credentials file.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Walnut:
    type: application
    platform: iOS
    sources:
      - path: Walnut
        excludes:
          - Support/PrivacyInfo.xcprivacy
      # The privacy manifest ships in the app bundle (App Store requirement):
      # no tracking, and a reason for each required-reason API the app calls
      # (UserDefaults CA92.1, file timestamps C617.1 for the app's own caches
      # and recordings, uptime clock 35F9.1 for the freeze watchdog). It
      # declares no collected data: everything the app sends goes to the
      # user's own Walnut server, which the developers never see.
      - path: Walnut/Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    # Hosted unit tests: `xcodebuild test -scheme Walnut` runs WalnutTests
    # (correctness + rendering-perf regression gates) on a simulator.
    scheme:
      testTargets:
        - WalnutTests
        - WalnutUITests
    info:
      path: Walnut/Support/Info.plist
      properties:
        CFBundleDisplayName: Walnut
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "107"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Allow plain-http Walnut servers on the local network (LAN mode);
        # cloud servers are HTTPS and unaffected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Multi-route connection: the app asks whether the paired Mac answers
        # directly on this network before it falls back to the cloud companion,
        # which is what raises the iOS local network prompt.
        NSLocalNetworkUsageDescription: Walnut connects straight to your Walnut on this Wi-Fi network when it can, which is faster than going through the cloud.
        # QR pairing (setup screen scans the wn://pair code) + photo attachments:
        # the chat composer's camera button and the note editor's Take Photo.
        NSCameraUsageDescription: Walnut uses the camera to scan the pairing QR code from your Walnut console and to take photos you attach to chats and notes.
        # Voice input: the composer mic button records speech and transcribes
        # it to text on your Walnut server.
        NSMicrophoneUsageDescription: Walnut uses the microphone for voice input. Your recording goes only to your own Walnut server, on your Mac or on a cloud machine you run, which turns it into text itself or with a speech service you set up on it.
        # Tasks-tab calendar view: device calendar events render read-only in
        # the day agenda next to your Walnut tasks. Read access only; nothing
        # is written to your calendars. (Deployment target is iOS 18, so only
        # the iOS 17+ full-access key is needed — no legacy NSCalendarsUsageDescription.)
        NSCalendarsFullAccessUsageDescription: Walnut shows your calendar events alongside tasks in the calendar view. Events are read-only and never leave your device.
        # Home-screen Quick Action (long-press the app icon): one tap opens the
        # mic and the transcript goes straight to the main agent — the fastest
        # path from pocket to Personal AI. `Type` must match
        # VoiceQuickAction.shortcutType (a unit test pins the pair).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: dev.openwalnut.ios.voice
            UIApplicationShortcutItemTitle: Voice to Walnut
            UIApplicationShortcutItemSubtitle: Record and send to your AI
            UIApplicationShortcutItemIconSymbolName: mic.fill
        # Apple Health (Settings, Apple Health): the app READS what the user
        # allows and keeps their own Walnut server up to date. Only the DEBUG
        # test-data seeder (HealthDebugSeed.swift) ever asks to write, yet the
        # update (write) string stays in every configuration: App Store
        # validation requires it whenever the binary calls
        # HKHealthStore.requestAuthorization(toShare:read:), which is also the
        # only way to ask to read (HealthDataSource asks with toShare: []).
        # Apple refused build 107 at upload when Release dropped it (2026-10-10).
        NSHealthShareUsageDescription: Walnut reads the Apple Health data you allow, so your AI can answer questions about your sleep, activity, heart and more. It goes only to your own Walnut server, on your Mac or on a cloud machine you run, and from there to the AI provider that server uses.
        NSHealthUpdateUsageDescription: Only Walnut's test builds add sample health data, to check that syncing works. The App Store version never changes your Apple Health data.
        # Places (Settings, Places): off until the user turns it on. iOS visit
        # monitoring needs Always, asked right after While Using (the order iOS
        # requires). No `location` background mode: iOS relaunches the app to
        # deliver a visit by itself.
        NSLocationWhenInUseUsageDescription: Walnut uses your location only for Places, after you turn it on. The places you visit go only to your own Walnut server, on your Mac or on a cloud machine you run, and from there to the AI provider that server uses. Apple Maps names each place.
        NSLocationAlwaysAndWhenInUseUsageDescription: With Places on, Walnut records the places you visit, even while it is closed, so your AI can answer where you were. They go only to your own Walnut server, on your Mac or on a cloud machine you run, and from there to the AI provider that server uses. Apple Maps names each place. iOS records visits only with Always.
        # The Health sync's app refresh task (HealthBackground.swift). Needs the
        # `fetch` background mode below.
        BGTaskSchedulerPermittedIdentifiers:
          - dev.openwalnut.ios.health-refresh
        # Keep a live voice recording running across screen lock / app
        # background. Without this the audio session dies the moment the
        # phone auto-locks mid-dictation (field data-loss incident 2026-08-09).
        # Apple's key covers it: "plays audible content or records audio while
        # in the background". The one thing it plays there: voice mode finishes
        # reading an answer the user asked to hear (SpeechOutput, capped at about
        # 40 s by SpokenText) when the screen locks or they switch apps. Nothing
        # new is read in the background: voice mode starts reading only while
        # Walnut is active (VoiceModeController).
        UIBackgroundModes:
          - audio
          # Human Inbox letter pushes carry `content-available`, so the app is
          # woken on delivery to refresh the inbox list and tab badge even when
          # the banner is never tapped. Without this the badge only catches up
          # on the next manual open.
          - remote-notification
          # Apple Health: the hourly app refresh that keeps the Mac current
          # when no HealthKit background delivery arrived.
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios
        # Points at the hand-written, committed entitlements file. NOT xcodegen's
        # `entitlements:` key — that GENERATES the plist from inline properties
        # and would overwrite the file (losing the comments that explain the APNs
        # environment split).
        CODE_SIGN_ENTITLEMENTS: Walnut/Support/Walnut.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        # Which APNs gateway this build's device token belongs to. A Debug build
        # gets a sandbox token, a Release (TestFlight/App Store) build a
        # production one; crossing them fails like a bad token.
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
  # Hosted unit tests (@testable import Walnut). Covers LiveMarkdownWindow
  # invariants, MessageRow pure helpers, clipProvisional, and the long-session
  # markdown rendering perf gates (see WalnutTests/MarkdownPerfTests.swift).
  # xcodegen auto-sets TEST_HOST/BUNDLE_LOADER from the app dependency.
  WalnutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WalnutTests
    dependencies:
      - target: Walnut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # Re-asserts, before any test case runs, that this process is cut off
        # from every real server: a hosted bundle inherits the app container's
        # pairing, so untouched, the mutating tests write to whatever server the
        # device is dogfooding. The guarantee itself is armed earlier, in
        # AppConfig (this hook loads only after the app has launched). See
        # WalnutTests/TestProcessNetworkBlackhole.swift. INFOPLIST_KEY_ is how a
        # key reaches a GENERATED Info.plist.
        INFOPLIST_KEY_NSPrincipalClass: WalnutTestsPrincipal
  # UI tests (XCUITest) — the layer that drives REAL taps. Exists because the
  # calendar's interaction contract (the view-switch menu, month day → Day view
  # drill-in, the Today button) can only be proven by tapping, and driving the
  # macOS Simulator window from outside the sandbox is unsafe on a shared
  # desktop: a blind coordinate click can land in another app's window.
  # XCUITest taps are scoped to the app under test and are deterministic.
  WalnutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WalnutUITests
    dependencies:
      - target: Walnut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
