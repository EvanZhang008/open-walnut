name: Walnut
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Automatic signing so device archives / TestFlight uploads resolve a real
    # cert + provisioning profile. Simulator builds don't sign and ignore these.
    # DEVELOPMENT_TEAM is left blank here (public repo) — the build/upload script
    # injects the signer's team ID from a local, gitignored credentials file.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Walnut:
    type: application
    platform: iOS
    sources:
      - Walnut
    # Hosted unit tests: `xcodebuild test -scheme Walnut` runs WalnutTests
    # (correctness + rendering-perf regression gates) on a simulator.
    scheme:
      testTargets:
        - WalnutTests
        - WalnutUITests
    info:
      path: Walnut/Support/Info.plist
      properties:
        CFBundleDisplayName: Walnut
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "56"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Allow plain-http Walnut servers on the local network (LAN mode);
        # cloud servers are HTTPS and unaffected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # QR pairing (setup screen scans the wn://pair code) + note photo
        # attachments (editor photo menu → Take Photo).
        NSCameraUsageDescription: Walnut uses the camera to scan the pairing QR code from your Walnut console and to take photos you attach to notes.
        # Voice input: the composer mic button records speech and transcribes
        # it to text on your Walnut server.
        NSMicrophoneUsageDescription: Walnut uses the microphone for voice input — speech is transcribed to text by your own Walnut server.
        # Tasks-tab calendar view: device calendar events render read-only in
        # the day agenda next to your Walnut tasks. Read access only; nothing
        # is written to your calendars. (Deployment target is iOS 18, so only
        # the iOS 17+ full-access key is needed — no legacy NSCalendarsUsageDescription.)
        NSCalendarsFullAccessUsageDescription: Walnut shows your calendar events alongside tasks in the calendar view. Events are read-only and never leave your device.
        # Home-screen Quick Action (long-press the app icon): one tap opens the
        # mic and the transcript goes straight to the main agent — the fastest
        # path from pocket to Personal AI. `Type` must match
        # VoiceQuickAction.shortcutType (a unit test pins the pair).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: dev.openwalnut.ios.voice
            UIApplicationShortcutItemTitle: Voice to Walnut
            UIApplicationShortcutItemSubtitle: Record and send to your AI
            UIApplicationShortcutItemIconSymbolName: mic.fill
        # Keep a live voice recording running across screen lock / app
        # background. Without this the audio session dies the moment the
        # phone auto-locks mid-dictation (field data-loss incident 2026-08-09).
        UIBackgroundModes:
          - audio
          # Human Inbox letter pushes carry `content-available`, so the app is
          # woken on delivery to refresh the inbox list and tab badge even when
          # the banner is never tapped. Without this the badge only catches up
          # on the next manual open.
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios
        # Points at the hand-written, committed entitlements file. NOT xcodegen's
        # `entitlements:` key — that GENERATES the plist from inline properties
        # and would overwrite the file (losing the comments that explain the APNs
        # environment split).
        CODE_SIGN_ENTITLEMENTS: Walnut/Support/Walnut.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        # Which APNs gateway this build's device token belongs to. A Debug build
        # gets a sandbox token, a Release (TestFlight/App Store) build a
        # production one; crossing them fails like a bad token.
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
  # Hosted unit tests (@testable import Walnut). Covers LiveMarkdownWindow
  # invariants, MessageRow pure helpers, clipProvisional, and the long-session
  # markdown rendering perf gates (see WalnutTests/MarkdownPerfTests.swift).
  # xcodegen auto-sets TEST_HOST/BUNDLE_LOADER from the app dependency.
  WalnutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WalnutTests
    dependencies:
      - target: Walnut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
  # UI tests (XCUITest) — the layer that drives REAL taps. Exists because the
  # calendar's interaction contract (the view-switch menu, month day → Day view
  # drill-in, the Today button) can only be proven by tapping, and driving the
  # macOS Simulator window from outside the sandbox is unsafe on a shared
  # desktop: a blind coordinate click can land in another app's window.
  # XCUITest taps are scoped to the app under test and are deterministic.
  WalnutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WalnutUITests
    dependencies:
      - target: Walnut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
