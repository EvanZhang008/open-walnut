name: Walnut
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Automatic signing so device archives / TestFlight uploads resolve a real
    # cert + provisioning profile. Simulator builds don't sign and ignore these.
    # DEVELOPMENT_TEAM is left blank here (public repo) — the build/upload script
    # injects the signer's team ID from a local, gitignored credentials file.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Walnut:
    type: application
    platform: iOS
    sources:
      - Walnut
    scheme: {}
    info:
      path: Walnut/Support/Info.plist
      properties:
        CFBundleDisplayName: Walnut
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "30"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Allow plain-http Walnut servers on the local network (LAN mode);
        # cloud servers are HTTPS and unaffected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # QR pairing: the setup screen scans the wn://pair code shown by the
        # web console (Settings → Devices).
        NSCameraUsageDescription: Walnut uses the camera to scan the pairing QR code from your Walnut console.
        # Voice input: the composer mic button records speech and transcribes
        # it to text on your Walnut server.
        NSMicrophoneUsageDescription: Walnut uses the microphone for voice input — speech is transcribed to text by your own Walnut server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openwalnut.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
