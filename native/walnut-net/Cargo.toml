[package]
name = "walnut-net"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Walnut's host network connector: carries Walnut daemon links between the user's own machines over iroh, direct or through the user's own relay"
publish = false

[dependencies]
anyhow = "1.0.104"
iroh = "=1.4.1"
n0-future = "0.3.2"
rand = "0.9"
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "time", "sync", "fs"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
